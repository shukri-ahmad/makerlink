<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLink Public Control</title>
    <link rel="icon" href="MakerLink Logo.jpg" type="image/jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
        }
        
        /* FUTURISTIC SLIDER UI */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #1e293b; border-radius: 9999px; border: 1px solid #334155; }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; height: 16px; width: 24px; border-radius: 9999px; background: #38bdf8; 
            cursor: pointer; margin-top: -6px; box-shadow: 0 0 12px rgba(56, 189, 248, 0.8); transition: transform 0.1s; 
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        
        #msg-box { transition: opacity 0.3s, transform 0.3s; }
        
        #terminal-output::-webkit-scrollbar, .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        #terminal-output::-webkit-scrollbar-track, .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        #terminal-output::-webkit-scrollbar-thumb, .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .maker-card { height: 380px; display: flex; flex-direction: column; transition: all 0.3s ease; }
        select { padding-right: 0 !important; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col p-4 md:p-6 overflow-x-hidden relative">

    <div id="msg-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-purple-600/90 backdrop-blur text-white px-6 py-3 rounded-xl shadow-[0_0_20px_rgba(147,51,234,0.5)] z-50 opacity-0 pointer-events-none font-bold text-center border border-purple-400 tracking-wide uppercase text-sm">Message</div>

    <header class="flex flex-col xl:flex-row justify-between items-center bg-slate-900/60 backdrop-blur-xl p-4 rounded-2xl shadow-xl border border-slate-700/50 mb-6 gap-6 xl:gap-0 shrink-0 relative z-10">
        <div class="flex items-center gap-4">
            <img src="MakerLink Logo.jpg" alt="MakerLink Logo" class="h-16 md:h-20 object-contain rounded-xl shadow-md mix-blend-screen opacity-90">
            <div class="flex flex-col justify-center">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 leading-tight tracking-tight">MakerLink Public</h1>
                    <div id="ping-indicator" class="w-3 h-3 rounded-full bg-slate-700 transition-colors duration-300" title="Cloud Connection Health"></div>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto justify-center">
            <input type="number" id="room-input" placeholder="ROOM ID" class="bg-black/30 border border-slate-600/50 rounded-xl px-4 py-2.5 font-mono text-white focus:outline-none focus:border-purple-500 w-full sm:w-32 text-center text-lg tracking-widest shadow-inner">
            <button id="btn-join" onclick="joinRoom()" class="active:scale-[0.97] transition-all bg-purple-600/90 hover:bg-purple-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-[0_0_15px_rgba(147,51,234,0.4)] border border-purple-500/50 whitespace-nowrap flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Join
            </button>
        </div>
    </header>

    <div class="flex flex-col gap-8 flex-1 w-full pb-20 relative z-10">
        <div id="empty-state" class="w-full text-center text-slate-500 mt-20 font-bold flex flex-col items-center gap-4">
            <svg class="w-20 h-20 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
            <p class="tracking-widest uppercase text-sm">Enter a Room ID to connect to a live Host.</p>
        </div>

        <div id="section-terminal" class="hidden flex-col">
            <div class="bg-slate-900/60 backdrop-blur-xl rounded-2xl border border-slate-700/50 shadow-2xl flex flex-col mb-2 overflow-hidden">
                <div class="p-3 border-b border-slate-700/50 flex justify-between items-center bg-black/20">
                    <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2 uppercase tracking-wide">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> Host Terminal Stream
                    </h3>
                </div>
                <div id="terminal-output" class="p-3 h-32 overflow-y-auto font-mono text-xs text-emerald-400 space-y-1 bg-transparent break-words">
                    <div class="text-slate-500 italic">Connected. Awaiting logs...</div>
                </div>
            </div>
        </div>

        <!-- PERFECT CSS GRID -->
        <div id="dashboard-grid" class="hidden grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 auto-rows-max items-start"></div>
    </div>

    <div class="fixed bottom-4 right-4 z-0 opacity-30 hover:opacity-100 transition-opacity flex items-center gap-2 pointer-events-none">
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Powered by</span>
        <img src="MAKEROBOT_ECO-Photoroom.jpg" alt="Makerobot Ecosystem" class="h-8 object-contain rounded mix-blend-screen pointer-events-auto">
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAMLoInCYEYyT97RtkjW6rnT0lKTu7_xik", authDomain: "makerlink-b575b.firebaseapp.com", databaseURL: "https://makerlink-b575b-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "makerlink-b575b", storageBucket: "makerlink-b575b.firebasestorage.app" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        
        let currentRoom = null; 
        const sensorCharts = {};
        let publicCardData = {}; 
        let watchdogTimer = null;
        let currentLayoutOrder = []; 
        const advancedData = {};
        
        const cardSizes = ['col-span-1', 'col-span-1 md:col-span-2', 'col-span-1 md:col-span-2 lg:col-span-3', 'col-span-1 md:col-span-2 lg:col-span-3 xl:col-span-4'];

        function getSVGIcon(type) {
            if(type === 'analog') return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>`;
            if(type === 'digital') return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>`;
            if(type === 'motor') return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`;
            if(type === 'servo') return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>`;
            return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`;
        }

        function pingCloud() {
            const p = document.getElementById('ping-indicator');
            if(!p) return;
            p.className = "w-3 h-3 rounded-full bg-purple-400 shadow-[0_0_12px_rgba(192,132,252,0.9)] transition-colors duration-75";
            clearTimeout(p.timer);
            p.timer = setTimeout(() => { p.className = "w-3 h-3 rounded-full bg-slate-700 transition-colors duration-300"; }, 150);
            clearTimeout(watchdogTimer);
            watchdogTimer = setTimeout(() => { p.className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_12px_rgba(239,68,68,0.9)] transition-colors duration-300"; }, 2500); 
        }

        function clearWatchdog() {
            clearTimeout(watchdogTimer);
            const p = document.getElementById('ping-indicator');
            if(p) p.className = "w-3 h-3 rounded-full bg-slate-700 transition-colors duration-300";
        }

        function getAnalogColor(val) {
            let r = Math.min(1, Math.max(0, val / 1023));
            let red = Math.round(100 + r * 149);
            let green = Math.round(116 - r * 1);
            let blue = Math.round(139 - r * 117);
            return `rgb(${red}, ${green}, ${blue})`;
        }

        function showMsg(msg) { const box = document.getElementById('msg-box'); box.innerText = msg; box.classList.remove('opacity-0', 'pointer-events-none'); box.classList.add('opacity-100'); setTimeout(() => { box.classList.remove('opacity-100'); box.classList.add('opacity-0', 'pointer-events-none'); }, 4000); }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }
        function appendTerminal(msg, time, colorClass) { const term = document.getElementById('terminal-output'); if (term.innerHTML.includes("Awaiting logs...")) term.innerHTML = ''; const line = document.createElement('div'); line.innerHTML = `<span class="text-slate-600 mr-2">[${time}]</span> <span class="${colorClass || 'text-emerald-400'}">${escapeHTML(msg)}</span>`; term.appendChild(line); term.scrollTop = term.scrollHeight; }

        function joinRoom() {
            const roomId = document.getElementById('room-input').value; if (!roomId) { showMsg("Please enter a valid Room ID."); return; }
            if(currentRoom) { db.ref('rooms/' + currentRoom + '/state').off(); db.ref('rooms/' + currentRoom + '/logs').off(); db.ref('rooms/' + currentRoom + '/layout').off(); db.ref('rooms/' + currentRoom + '/config').off(); db.ref('rooms/' + currentRoom + '/heartbeat').off(); }
            currentRoom = roomId; const btn = document.getElementById('btn-join'); 
            btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Connected`; 
            btn.className = "active:scale-[0.97] transition-all bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.5)] border border-emerald-500/50 whitespace-nowrap flex items-center gap-2";
            showMsg(`Joined Room ${roomId}`);
            document.getElementById('empty-state').innerHTML = `<svg class="w-16 h-16 text-purple-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><p class="tracking-widest uppercase text-sm">Waiting for Host data...</p>`;
            document.getElementById('section-terminal').classList.add('hidden'); document.getElementById('section-terminal').classList.remove('flex');
            document.getElementById('dashboard-grid').classList.add('hidden'); document.getElementById('dashboard-grid').classList.remove('grid');

            db.ref('rooms/' + currentRoom + '/config').on('value', (snap) => {
                const cfg = snap.val();
                const termSec = document.getElementById('section-terminal');
                if (cfg && cfg.terminalVisible === false) { termSec.style.display = 'none'; } 
                else { termSec.style.display = 'flex'; }
            });

            db.ref('rooms/' + currentRoom + '/heartbeat').on('value', (snap) => {
                if(snap.val()) pingCloud();
            });

            db.ref('rooms/' + currentRoom + '/state').on('value', (snap) => { 
                let data = snap.val(); 
                if(data) { 
                    if (data.empty) {
                        document.getElementById('empty-state').classList.remove('hidden');
                        document.getElementById('dashboard-grid').classList.add('hidden');
                        document.getElementById('empty-state').innerHTML = `<svg class="w-16 h-16 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg><p class="tracking-widest uppercase text-sm">Host is connected, but no cards are visible.</p>`;
                        return;
                    }
                    if (!Array.isArray(data)) data = Object.values(data);
                    renderSharedCards(data); 
                } else { 
                    clearWatchdog();
                    document.getElementById('empty-state').classList.remove('hidden'); 
                    document.getElementById('dashboard-grid').classList.add('hidden'); 
                    document.getElementById('dashboard-grid').classList.remove('grid'); 
                    document.getElementById('empty-state').innerHTML = `<svg class="w-16 h-16 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg><p class="tracking-widest uppercase text-sm">Room ${roomId} is empty or closed.</p>`; 
                } 
            });
            
            db.ref('rooms/' + currentRoom + '/logs').on('child_added', (snap) => { const log = snap.val(); if (log) appendTerminal(log.msg, log.time, log.color); });
            
            db.ref('rooms/' + currentRoom + '/layout').on('value', (snap) => { 
                const layoutOrder = snap.val(); 
                if(layoutOrder && Array.isArray(layoutOrder)) { 
                    currentLayoutOrder = layoutOrder;
                    applyPublicLayout(); 
                } 
            });
        }
        
        function applyPublicLayout() {
            if (!currentLayoutOrder || currentLayoutOrder.length === 0) return;
            const grid = document.getElementById('dashboard-grid'); 
            currentLayoutOrder.forEach(item => { 
                let id = typeof item === 'string' ? item : item.id;
                const card = document.getElementById(`public-card-${id}`); 
                if(card) {
                    let s = item.size || '0';
                    card.setAttribute('data-size', s);
                    
                    card.className = card.className.replace(/\b(md:|lg:|xl:)?col-span-\d\b/g, '').replace(/\s+/g, ' ').trim();
                    let newClasses = cardSizes[parseInt(s)].split(' ');
                    card.classList.add(...newClasses);
                    
                    grid.appendChild(card); 
                }
            });
        }

        function sendRemoteCommand(cmd) { 
            if(!currentRoom) return; 
            let id = cmd.split(':')[0];
            let card = publicCardData[id];
            if (card && card.publicControl === false) return; 
            db.ref('rooms/' + currentRoom + '/command').push({ cmd: cmd, ts: Date.now() }); 
        }
        
        function sendMotorRemoteCommand(id, action) {
            let card = publicCardData[id];
            if (!card) return;
            if (card.publicControl === false) return; 
            
            let cwSpd = card.cwSpd !== undefined ? parseInt(card.cwSpd) : 255;
            let ccwSpd = card.ccwSpd !== undefined ? parseInt(card.ccwSpd) : 255;
            let val = 0;
            
            if (action === 'cw') val = cwSpd;
            else if (action === 'ccw') val = -ccwSpd;
            
            if (id === 'M1' || id === 'M2') { val = -val; }
            
            sendRemoteCommand(`${id}:${val}`);
            
            let displayStr = 'STOP (0)';
            if (val !== 0) {
                if (id === 'M1' || id === 'M2') displayStr = val < 0 ? `CW (${Math.abs(val)})` : `CCW (${Math.abs(val)})`;
                else displayStr = val > 0 ? `CW (${Math.abs(val)})` : `CCW (${Math.abs(val)})`;
            }
            let el = document.getElementById(`val-${id}`);
            if (el) el.innerText = displayStr;
        }

        function updateDigitalUI(id, val) {
            let v = Number(val); let valIn = document.getElementById(`val-${id}`);
            if(valIn) { 
                valIn.innerText = v === 1 ? 'HIGH' : 'LOW'; 
                if(v === 1) { valIn.style.backgroundColor = '#dc2626'; valIn.style.color = '#ffffff'; valIn.style.borderColor = '#f87171'; valIn.style.boxShadow = '0 0 25px rgba(220, 38, 38, 0.8)'; } 
                else { valIn.style.backgroundColor = 'rgba(0,0,0,0.4)'; valIn.style.color = '#64748b'; valIn.style.borderColor = '#334155'; valIn.style.boxShadow = 'inset 0 4px 6px rgba(0, 0, 0, 0.6)'; } 
            }
            
            let valOut = document.getElementById(`val-out-${id}`);
            if(valOut) { 
                if(v === 1) { valOut.style.backgroundColor = '#2563eb'; valOut.style.borderColor = '#60a5fa'; valOut.style.boxShadow = '0 0 25px rgba(37, 99, 235, 0.8)'; } 
                else { valOut.style.backgroundColor = 'rgba(0,0,0,0.4)'; valOut.style.borderColor = '#334155'; valOut.style.boxShadow = 'inset 0 4px 6px rgba(0, 0, 0, 0.6)'; } 
            }
            
            let card = document.getElementById(`public-card-${id}`);
            if(card) {
                if(v === 1) card.style.boxShadow = '0 0 20px rgba(16, 185, 129, 0.15)';
                else card.style.boxShadow = '';
            }
        }

        function updateAnalogOutUI(id, val) {
            let v = Number(val);
            let elOut = document.getElementById(`val-out-${id}`);
            if(elOut) { elOut.innerText = v; elOut.style.color = getAnalogColor(v); }
            let sl = document.getElementById(`slider-${id}`);
            if(sl && sl.value != v) sl.value = v;
        }

        function updateVal(id, val) { 
            let valEl = document.getElementById(`val-${id}`);
            if(valEl) valEl.innerText = val + (id.startsWith('S') ? '°' : ''); 
            advancedData[id] = Number(val) || val; 
        }

        function renderSharedCards(sharedCards) {
            const gridEl = document.getElementById('dashboard-grid');
            document.getElementById('empty-state').classList.add('hidden'); 
            document.getElementById('section-terminal').classList.remove('hidden'); 
            gridEl.classList.remove('hidden'); gridEl.classList.add('grid'); // Fixed for perfect grid!
            
            const currentCardIds = sharedCards.map(c => `public-card-${c.id}`);
            document.querySelectorAll('[id^="public-card-"]').forEach(child => { if (!currentCardIds.includes(child.id)) child.remove(); });

            sharedCards.forEach(card => {
                try {
                    publicCardData[card.id] = card; 
                    advancedData[card.id] = card.val; 
                    
                    let cardEl = document.getElementById(`public-card-${card.id}`);
                    let isOutput = (card.type === 'analog' && card.mode === 'OUT') || (card.type === 'digital' && (card.mode === 'OUT' || card.mode === 'PUSH')) || card.type === 'motor' || card.type === 'servo';
                    
                    if (!cardEl) {
                        cardEl = document.createElement('div'); 
                        let borderTheme = card.type === 'analog' ? 'border-purple-500/30' : card.type === 'digital' ? 'border-emerald-500/30' : card.type === 'motor' ? 'border-orange-500/30' : card.type === 'text' ? 'border-pink-500/30' : 'border-blue-500/30';
                        
                        // Glassmorphism classes applied here!
                        cardEl.className = `col-span-1 maker-card bg-slate-900/60 backdrop-blur-xl rounded-2xl border ${borderTheme} shadow-xl relative z-10`;
                        cardEl.id = `public-card-${card.id}`;
                        cardEl.setAttribute('data-size', '0');
                        
                        let colorClass = card.type === 'analog' ? 'text-purple-400' : card.type === 'digital' ? 'text-emerald-400' : card.type === 'motor' ? 'text-orange-400' : card.type === 'text' ? 'text-pink-400' : 'text-blue-400';
                        let iconStr = getSVGIcon(card.type);

                        let permBtnHTML = isOutput ? `<span id="public-perm-${card.id}" class="ml-2 text-[9px] font-bold tracking-wider border px-2 py-0.5 rounded transition-colors bg-green-900/40 text-green-400 border-green-700/50 shadow-[0_0_8px_rgba(74,222,128,0.2)]">🎮 PUBLIC</span>` : '';

                        let html = `<div class="p-3 border-b ${borderTheme} flex justify-between items-center bg-black/20 rounded-t-2xl"><div class="flex items-center gap-2"><span class="font-bold text-sm tracking-wide ${colorClass}">${card.id}</span><span class="text-[10px] font-bold tracking-wider bg-black/40 px-2 py-0.5 rounded text-slate-400 border border-slate-700/50 flex items-center gap-1">${iconStr} ${card.mode || card.type.toUpperCase()}</span></div><div class="flex items-center">${permBtnHTML}</div></div><div class="p-5 flex-1 min-h-0 flex flex-col justify-center items-center bg-transparent overflow-hidden">`;

                        if (card.type === 'analog' && card.mode === 'IN') {
                            html += `<div class="w-full flex-1 relative min-h-[120px] bg-black/20 rounded-xl border border-slate-700/50 mb-4 flex items-center justify-center overflow-hidden">
                                         <div id="val-${card.id}" class="absolute z-10 text-6xl font-mono font-black tracking-tighter transition-colors duration-200" style="color: rgb(100, 116, 139); text-shadow: 0px 4px 20px rgba(0,0,0,1);">0</div>
                                         <canvas id="chart-${card.id}" class="absolute inset-0 w-full h-full opacity-70"></canvas>
                                     </div>
                                     <div class="flex gap-3 w-full mt-auto">
                                        <div class="flex-1 flex flex-col"><label class="text-[9px] text-slate-500 tracking-wider text-center font-bold">MIN</label><input type="number" id="ymin-${card.id}" value="" placeholder="Auto" readonly onchange="updateSensorChartConfig('${card.id}')" class="ui-editable-num w-full bg-black/30 border border-slate-700/50 rounded-lg px-2 py-1.5 text-center text-xs font-mono text-slate-300"></div>
                                        <div class="flex-1 flex flex-col"><label class="text-[9px] text-slate-500 tracking-wider text-center font-bold">MAX</label><input type="number" id="ymax-${card.id}" value="" placeholder="Auto" readonly onchange="updateSensorChartConfig('${card.id}')" class="ui-editable-num w-full bg-black/30 border border-slate-700/50 rounded-lg px-2 py-1.5 text-center text-xs font-mono text-slate-300"></div>
                                        <div class="flex-1 flex flex-col">
                                            <label class="text-[9px] text-slate-500 tracking-wider text-center font-bold">TIME</label>
                                            <select id="time-${card.id}" disabled class="ui-editable-num w-full bg-black/30 border border-slate-700/50 rounded-lg px-2 py-1.5 text-center text-xs font-mono text-slate-300 appearance-none">
                                                <option value="0">All</option>
                                                <option value="900000">15m</option>
                                                <option value="3600000">1h</option>
                                                <option value="14400000">4h</option>
                                            </select>
                                        </div>
                                     </div>`;
                        } 
                        else if (card.type === 'analog' && card.mode === 'OUT') {
                            html += `<div class="w-full flex-1 flex items-center justify-center">
                                         <div id="val-out-${card.id}" class="text-6xl font-mono font-black tracking-tighter transition-colors duration-200" style="color: rgb(100, 116, 139); text-shadow: 0px 4px 15px rgba(0,0,0,0.5);">0</div>
                                     </div>
                                     <input type="range" id="slider-${card.id}" min="0" max="1023" value="0" oninput="if(!this.disabled) { updateAnalogOutUI('${card.id}', this.value); sendRemoteCommand('${card.id}:'+this.value); }" class="w-full mb-3 mt-auto">
                                     <div class="flex justify-between w-full text-xs text-slate-500 font-mono tracking-widest"><span>0</span><span>1023</span></div>`;
                        } 
                        else if (card.type === 'digital' && card.mode === 'IN') {
                            html += `<div id="val-${card.id}" class="w-28 h-28 rounded-full flex items-center justify-center text-3xl font-bold tracking-widest transition-all duration-300 border-[4px] shadow-2xl">LOW</div>`;
                        } else if (card.type === 'digital' && card.mode === 'OUT') {
                            html += `<div class="flex-1 flex items-center justify-center w-full">
                                         <div id="val-out-${card.id}" class="w-24 h-24 rounded-2xl transition-all duration-300 border-[3px] shadow-2xl"></div>
                                     </div>
                                     <div class="flex gap-3 w-full mt-auto">
                                         <button id="btn-off-${card.id}" onclick="if(!this.disabled) { sendRemoteCommand('${card.id}:0'); updateDigitalUI('${card.id}', 0); }" class="ui-btn-editable flex-1 py-3 px-2 bg-slate-800/80 hover:bg-slate-700/80 rounded-xl text-slate-400 font-bold tracking-widest text-sm shadow-lg active:scale-[0.97] transition-all border border-slate-700/50 text-center cursor-pointer focus:outline-none truncate">${card.btnOff || "OFF"}</button>
                                         <button id="btn-on-${card.id}" onclick="if(!this.disabled) { sendRemoteCommand('${card.id}:1'); updateDigitalUI('${card.id}', 1); }" class="ui-btn-editable flex-1 py-3 px-2 bg-red-600/90 hover:bg-red-500/90 rounded-xl text-white font-bold tracking-widest text-sm shadow-[0_0_15px_rgba(220,38,38,0.4)] active:scale-[0.97] transition-all border border-red-500/50 text-center cursor-pointer focus:outline-none truncate">${card.btnOn || "ON"}</button>
                                     </div>`;
                        } else if (card.type === 'digital' && card.mode === 'PUSH') {
                            html += `<div class="flex-1 flex items-center justify-center w-full">
                                         <div id="val-out-${card.id}" class="w-24 h-24 rounded-full transition-all duration-300 border-[3px] shadow-2xl"></div>
                                     </div>
                                     <div class="flex w-full mt-auto">
                                         <button id="btn-push-${card.id}" 
                                            onmousedown="if(!this.disabled) { sendRemoteCommand('${card.id}:1'); updateDigitalUI('${card.id}', 1); }" 
                                            onmouseup="if(!this.disabled) { sendRemoteCommand('${card.id}:0'); updateDigitalUI('${card.id}', 0); }" 
                                            onmouseleave="if(!this.disabled && advancedData['${card.id}'] == 1) { sendRemoteCommand('${card.id}:0'); updateDigitalUI('${card.id}', 0); }"
                                            ontouchstart="if(!this.disabled) { sendRemoteCommand('${card.id}:1'); updateDigitalUI('${card.id}', 1); }"
                                            ontouchend="if(!this.disabled) { sendRemoteCommand('${card.id}:0'); updateDigitalUI('${card.id}', 0); }"
                                            class="ui-btn-editable w-full py-4 px-2 bg-purple-600/90 hover:bg-purple-500/90 rounded-xl text-white font-bold tracking-widest text-lg shadow-[0_0_20px_rgba(147,51,234,0.4)] active:scale-[0.97] transition-all border border-purple-500/50 text-center cursor-pointer focus:outline-none truncate select-none">${card.btnPush || "HOLD"}</button>
                                     </div>`;
                        } else if (card.type === 'text') {
                            let displayTxt = card.val !== undefined ? card.val : "";
                            html += `<div class="w-full h-full overflow-y-auto custom-scrollbar flex p-4 bg-black/20 rounded-xl border border-slate-700/50"><div id="val-${card.id}" class="m-auto w-full text-center text-3xl font-bold tracking-tight text-pink-400 break-words whitespace-pre-wrap drop-shadow-md">${displayTxt}</div></div>`;
                        } else if (card.type === 'motor') {
                            let mStart = card.val !== undefined ? Number(card.val) : 0;
                            let mDisplayStr = 'STOP (0)';
                            if (mStart !== 0) {
                                if (card.id === 'M1' || card.id === 'M2') mDisplayStr = mStart < 0 ? `CW (${Math.abs(mStart)})` : `CCW (${Math.abs(mStart)})`;
                                else mDisplayStr = mStart > 0 ? `CW (${Math.abs(mStart)})` : `CCW (${Math.abs(mStart)})`;
                            }
                            
                            html += `<div id="val-${card.id}" class="text-2xl font-mono text-orange-400 font-bold mb-4 w-full text-center bg-black/30 py-3 rounded-xl border border-slate-700/50 shadow-inner drop-shadow-md">${mDisplayStr}</div>
                                     <div class="flex flex-col gap-3 w-full mt-auto">
                                         <div class="flex justify-center gap-3 w-full">
                                             <button id="btn-ccw-${card.id}" onclick="if(!this.disabled) { sendMotorRemoteCommand('${card.id}', 'ccw'); }" class="ui-btn-editable flex-1 bg-yellow-600/90 hover:bg-yellow-500/90 text-white tracking-wider text-sm font-bold py-2.5 px-2 rounded-xl shadow-lg active:scale-[0.97] transition-all border border-yellow-500/50 cursor-pointer text-center focus:outline-none truncate">${card.btnCcw || "⏪ CCW"}</button>
                                             <button id="btn-cw-${card.id}" onclick="if(!this.disabled) { sendMotorRemoteCommand('${card.id}', 'cw'); }" class="ui-btn-editable flex-1 bg-green-600/90 hover:bg-green-500/90 text-white tracking-wider text-sm font-bold py-2.5 px-2 rounded-xl shadow-lg active:scale-[0.97] transition-all border border-green-500/50 cursor-pointer text-center focus:outline-none truncate">${card.btnCw || "CW ⏩"}</button>
                                         </div>
                                         <button id="btn-stop-${card.id}" onclick="if(!this.disabled) { sendMotorRemoteCommand('${card.id}', 'stop'); }" class="ui-btn-editable w-full bg-red-600/90 hover:bg-red-500/90 text-white tracking-wider text-sm font-bold py-3 px-2 rounded-xl shadow-[0_0_15px_rgba(220,38,38,0.3)] active:scale-[0.97] transition-all border border-red-500/50 cursor-pointer text-center focus:outline-none truncate">${card.btnStop || "⏹️ STOP"}</button>
                                     </div>`;
                        } else if (card.type === 'servo') {
                            let p1 = card.pos1Val !== undefined ? parseInt(card.pos1Val) : 0;
                            let p2 = card.pos2Val !== undefined ? parseInt(card.pos2Val) : 180;
                            let minBound = Math.min(p1, p2);
                            let maxBound = Math.max(p1, p2);
                            
                            let sVal = card.val !== undefined ? parseInt(card.val) : 90;
                            sVal = Math.max(minBound, Math.min(maxBound, sVal));
                            
                            html += `<div id="val-${card.id}" class="text-6xl font-mono text-blue-400 font-black tracking-tighter drop-shadow-[0_0_15px_rgba(96,165,250,0.5)] mb-6 mt-auto">${sVal}°</div>
                                     <div class="flex gap-4 w-full mt-auto">
                                         <div class="flex-1 flex flex-col gap-1.5">
                                             <label class="text-[9px] text-slate-500 tracking-wider text-center font-bold">LIMIT 1</label>
                                             <div class="w-full bg-black/30 border border-slate-700/50 rounded-lg px-2 py-1.5 text-center text-xs font-mono text-blue-400 shadow-inner mb-1" id="pos1-val-display-${card.id}">${p1}</div>
                                             <button id="btn-pos1-${card.id}" onclick="if(!this.disabled) { sendRemoteCommand('${card.id}:POS1'); }" class="ui-btn-editable w-full bg-blue-600/90 hover:bg-blue-500/90 text-white tracking-wider text-xs font-bold py-2 px-1 rounded-xl shadow-[0_0_12px_rgba(37,99,235,0.4)] active:scale-[0.97] transition-all border border-blue-500/50 cursor-pointer text-center focus:outline-none truncate mt-1">${card.btnPos1 || 'POS 1'}</button>
                                         </div>
                                         <div class="flex-1 flex flex-col gap-1.5">
                                             <label class="text-[9px] text-slate-500 tracking-wider text-center font-bold">LIMIT 2</label>
                                             <div class="w-full bg-black/30 border border-slate-700/50 rounded-lg px-2 py-1.5 text-center text-xs font-mono text-blue-400 shadow-inner mb-1" id="pos2-val-display-${card.id}">${p2}</div>
                                             <button id="btn-pos2-${card.id}" onclick="if(!this.disabled) { sendRemoteCommand('${card.id}:POS2'); }" class="ui-btn-editable w-full bg-blue-600/90 hover:bg-blue-500/90 text-white tracking-wider text-xs font-bold py-2 px-1 rounded-xl shadow-[0_0_12px_rgba(37,99,235,0.4)] active:scale-[0.97] transition-all border border-blue-500/50 cursor-pointer text-center focus:outline-none truncate mt-1">${card.btnPos2 || 'POS 2'}</button>
                                         </div>
                                     </div>`;
                        }

                        html += `</div><div id="title-${card.id}" class="p-3 bg-black/20 border-t ${borderTheme} rounded-b-2xl flex justify-center text-xs font-bold tracking-widest text-slate-400 uppercase cursor-default truncate">${card.title || 'Label'}</div>`;
                        cardEl.innerHTML = html; gridEl.appendChild(cardEl);
                        if (card.type === 'analog' && card.mode === 'IN') initChart(card.id);
                        if (card.type === 'analog' && card.mode === 'OUT') updateAnalogOutUI(card.id, card.val || 0);
                        if (card.type === 'digital') updateDigitalUI(card.id, card.val || 0); 
                    }

                    let titleEl = document.getElementById(`title-${card.id}`); if(titleEl) titleEl.innerText = card.title || "Label";
                    
                    if (card.type === 'analog' && card.mode === 'IN') {
                        let tEl = document.getElementById(`time-${card.id}`);
                        if (tEl && card.time !== undefined) { tEl.value = card.time; }
                    }

                    if (card.type === 'digital' && card.mode === 'OUT') { let bOff = document.getElementById(`btn-off-${card.id}`); if(bOff) bOff.innerText = card.btnOff || "OFF"; let bOn = document.getElementById(`btn-on-${card.id}`); if(bOn) bOn.innerText = card.btnOn || "ON"; } 
                    else if (card.type === 'digital' && card.mode === 'PUSH') { let bPush = document.getElementById(`btn-push-${card.id}`); if(bPush) bPush.innerText = card.btnPush || "HOLD"; }
                    else if (card.type === 'motor') { let bCcw = document.getElementById(`btn-ccw-${card.id}`); if(bCcw) bCcw.innerText = card.btnCcw || "⏪ CCW"; let bStop = document.getElementById(`btn-stop-${card.id}`); if(bStop) bStop.innerText = card.btnStop || "⏹️ STOP"; let bCw = document.getElementById(`btn-cw-${card.id}`); if(bCw) bCw.innerText = card.btnCw || "CW ⏩"; } 
                    else if (card.type === 'servo') { 
                        let bP1 = document.getElementById(`btn-pos1-${card.id}`); if(bP1) bP1.innerText = card.btnPos1 || "POS 1"; 
                        let bP2 = document.getElementById(`btn-pos2-${card.id}`); if(bP2) bP2.innerText = card.btnPos2 || "POS 2"; 
                        let d1 = document.getElementById(`pos1-val-display-${card.id}`); if(d1) d1.innerText = card.pos1Val !== undefined ? card.pos1Val : 0;
                        let d2 = document.getElementById(`pos2-val-display-${card.id}`); if(d2) d2.innerText = card.pos2Val !== undefined ? card.pos2Val : 180;
                        
                        let valNum = parseFloat(card.val) || 0;
                        let minB = Math.min(card.pos1Val || 0, card.pos2Val || 180);
                        let maxB = Math.max(card.pos1Val || 0, card.pos2Val || 180);
                        
                        valNum = Math.max(minB, Math.min(maxBound, valNum));
                        
                        let vl = document.getElementById(`val-${card.id}`); 
                        if(vl) {
                            vl.innerText = valNum + '°'; 
                        }
                    }

                    if (isOutput) {
                        let canControl = card.publicControl !== false; 
                        let badge = document.getElementById(`public-perm-${card.id}`);
                        if (badge) {
                            if (canControl) {
                                badge.innerText = "🎮 PUBLIC";
                                badge.className = "ml-2 text-[9px] font-bold tracking-wider border px-2 py-0.5 rounded transition-colors bg-green-900/40 text-green-400 border-green-700/50 shadow-[0_0_8px_rgba(74,222,128,0.2)]";
                            } else {
                                badge.innerText = "👁️ VIEW ONLY";
                                badge.className = "ml-2 text-[9px] font-bold tracking-wider border px-2 py-0.5 rounded transition-colors bg-red-900/40 text-red-400 border-red-700/50";
                            }
                        }
                        
                        let elsToToggle = [];
                        if (card.type === 'analog' && card.mode === 'OUT') elsToToggle = [`slider-${card.id}`];
                        else if (card.type === 'digital' && card.mode === 'OUT') elsToToggle = [`btn-on-${card.id}`, `btn-off-${card.id}`];
                        else if (card.type === 'digital' && card.mode === 'PUSH') elsToToggle = [`btn-push-${card.id}`];
                        else if (card.type === 'motor') elsToToggle = [`btn-ccw-${card.id}`, `btn-cw-${card.id}`, `btn-stop-${card.id}`];
                        else if (card.type === 'servo') elsToToggle = [`btn-pos1-${card.id}`, `btn-pos2-${card.id}`]; 
                        
                        elsToToggle.forEach(eid => {
                            let el = document.getElementById(eid);
                            if(el) {
                                el.disabled = !canControl;
                                if(canControl) { el.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none'); } 
                                else { el.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none'); }
                            }
                        });
                    }

                    if (card.type === 'text') { let el = document.getElementById(`val-${card.id}`); if(el) el.innerText = card.val; } 
                    else if (card.type !== 'servo') { 
                        let valNum = parseFloat(card.val) || 0;
                        if (card.type === 'analog' && card.mode === 'IN') {
                            let el = document.getElementById(`val-${card.id}`); 
                            if(el) { el.innerText = valNum; el.style.color = getAnalogColor(valNum); pushChartData(card.id, valNum); }
                            let chart = sensorCharts[card.id]; 
                            if(chart) { 
                                if (card.ymin === "") delete chart.options.scales.y.min; else chart.options.scales.y.min = parseFloat(card.ymin); 
                                if (card.ymax === "") delete chart.options.scales.y.max; else chart.options.scales.y.max = parseFloat(card.ymax); 
                                chart.update(); 
                            }
                        } else if (card.type === 'analog' && card.mode === 'OUT') { updateAnalogOutUI(card.id, valNum); } 
                        else if (card.type === 'digital') { updateDigitalUI(card.id, valNum); } 
                        else if (card.type === 'motor') { 
                            let el = document.getElementById(`val-${card.id}`); 
                            if (el) { 
                                let displayStr = 'STOP (0)';
                                if (valNum !== 0) {
                                    if (card.id === 'M1' || card.id === 'M2') {
                                        displayStr = valNum < 0 ? `CW (${Math.abs(valNum)})` : `CCW (${Math.abs(valNum)})`;
                                    } else {
                                        displayStr = valNum > 0 ? `CW (${Math.abs(valNum)})` : `CCW (${Math.abs(valNum)})`;
                                    }
                                }
                                el.innerText = displayStr; 
                            } 
                        }
                    }
                } catch (err) {
                    console.error("Error processing card data", card, err);
                }
            });
            
            applyPublicLayout();
        }

        function initChart(id) { const ctx = document.getElementById(`chart-${id}`).getContext('2d'); sensorCharts[id] = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#c084fc', tension: 0.3, pointRadius: 0, borderWidth: 2, fill: true, backgroundColor: 'rgba(192, 132, 252, 0.1)' }] }, options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } } }); }
        
        function pushChartData(id, val) { 
            if(!sensorCharts[id]) return; 
            const chart = sensorCharts[id]; 
            const timeEl = document.getElementById(`time-${id}`); 
            const windowMs = (timeEl && timeEl.value !== "") ? parseInt(timeEl.value) : 0; 
            
            let now = Date.now();
            chart.data.labels.push(now); 
            chart.data.datasets[0].data.push(val); 
            
            if(windowMs > 0) { 
                let cutoff = now - windowMs;
                while(chart.data.labels.length > 0 && chart.data.labels[0] < cutoff) {
                    chart.data.labels.shift(); 
                    chart.data.datasets[0].data.shift();
                }
            } 
            
            if (chart.data.labels.length > 1500) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            
            chart.update(); 
        }
    </script>
</body>
</html>
