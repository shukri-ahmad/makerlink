<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLink Host</title>
    <link rel="icon" href="MakerLink Logo.jpg" type="image/jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: radial-gradient(circle at top right, #1e293b, #0f172a); }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #1e293b; border-radius: 9999px; border: 1px solid #334155; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 24px; border-radius: 9999px; background: #38bdf8; cursor: pointer; margin-top: -6px; box-shadow: 0 0 12px rgba(56, 189, 248, 0.8); transition: transform 0.1s; }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        body.is-editing .ui-editable { border-bottom: 1px dashed #facc15; border-radius: 0; cursor: text !important; }
        body:not(.is-editing) .ui-editable { border-bottom: 1px solid transparent; }
        body:not(.is-editing) .maker-card { cursor: default; }
        body.is-editing .maker-card { cursor: grab; border-color: #facc15 !important; box-shadow: 0 0 15px rgba(250, 204, 21, 0.2); }
        body.is-editing .maker-card:active { cursor: grabbing; }
        body.is-editing .ui-btn-editable { user-select: text !important; -webkit-user-select: text !important; }
        .size-btns { display: none; }
        body.is-editing .size-btns { display: flex; }
        .edit-only-flex { display: none; }
        body.is-editing .edit-only-flex { display: flex; }
        #msg-box { transition: opacity 0.3s, transform 0.3s; }
        #terminal-output::-webkit-scrollbar, .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        #terminal-output::-webkit-scrollbar-track, .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        #terminal-output::-webkit-scrollbar-thumb, .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .maker-card { height: 380px; display: flex; flex-direction: column; transition: all 0.3s ease; }
        .sortable-ghost { opacity: 0.4; filter: grayscale(100%); }
        select { padding-right: 0 !important; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col p-4 md:p-6 overflow-x-hidden relative">

    <div id="msg-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600/90 backdrop-blur text-white px-6 py-3 rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.5)] z-50 opacity-0 pointer-events-none font-bold text-center border border-red-400 tracking-wide uppercase text-sm">Message</div>

    <header class="flex flex-col xl:flex-row justify-between items-center bg-slate-900/60 backdrop-blur-xl p-4 rounded-2xl shadow-xl border border-slate-700/50 mb-6 gap-6 xl:gap-0 shrink-0 relative z-10">
        <div class="flex items-center gap-4">
            <img src="MakerLink Logo.jpg" alt="MakerLink Logo" class="h-16 md:h-20 object-contain rounded-xl shadow-md mix-blend-screen opacity-90">
            <div class="flex flex-col justify-center">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 leading-tight tracking-tight">MakerLink Host</h1>
                    <div id="ping-indicator" class="w-3 h-3 rounded-full bg-slate-700 transition-colors duration-300" title="Bluetooth Activity"></div>
                </div>
                <p class="text-emerald-400/80 text-xs font-bold tracking-widest mt-1 uppercase">Cyber-Physical SCADA Terminal</p>
            </div>
        </div>
        <div class="flex flex-wrap gap-3 justify-center">
            <button id="btn-mute" onclick="toggleMute()" class="active:scale-[0.97] transition-all bg-slate-700/90 hover:bg-slate-600 text-white font-bold py-2.5 px-4 rounded-xl shadow-lg border border-slate-600/50 flex items-center justify-center gap-2">🔊 SOUND ON</button>
            <button id="btnConnect" onclick="connectBluetooth()" class="active:scale-[0.97] transition-all bg-blue-600/90 hover:bg-blue-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] border border-blue-500/50 flex items-center gap-2">Connect</button>
            <button id="btn-edit" onclick="toggleEditMode()" class="active:scale-[0.97] transition-all bg-slate-700/90 hover:bg-slate-600 text-white font-bold py-2.5 px-5 rounded-xl shadow-lg border border-slate-600/50 min-w-[140px] flex items-center justify-center gap-2">Edit Layout</button>
            <button id="btn-cloud" onclick="toggleCloud()" class="active:scale-[0.97] transition-all bg-purple-600/90 hover:bg-purple-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-[0_0_15px_rgba(147,51,234,0.4)] border border-purple-500/50 min-w-[140px] flex items-center justify-center gap-2">Go Public</button>
            <button id="btn-clear" onclick="clearDashboard()" class="active:scale-[0.97] transition-all bg-red-900/80 hover:bg-red-800 text-white font-bold py-2.5 px-5 rounded-xl shadow-lg border border-red-800/50 flex items-center gap-2">Clear</button>
        </div>
    </header>

    <div class="flex flex-col gap-8 flex-1 pb-20 relative z-10">
        <div class="bg-slate-900/60 backdrop-blur-xl rounded-2xl border border-slate-700/50 shadow-2xl flex flex-col mb-2 overflow-hidden">
            <div class="p-3 border-b border-slate-700/50 flex justify-between items-center bg-black/20">
                <div class="flex items-center gap-2">
                    <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2 uppercase tracking-wide">System Terminal</h3>
                    <button id="vis-btn-terminal" onclick="toggleVisibility('terminal')" class="ml-2 text-[10px] border px-2 py-0.5 rounded cursor-pointer hover:bg-slate-700 transition-colors bg-blue-900/30 text-blue-400 border-blue-700/50">👁️ VISIBLE</button>
                </div>
                <button onclick="document.getElementById('terminal-output').innerHTML='<div class=\'text-slate-600 italic\'>Logs cleared.</div>'" class="active:scale-95 text-[10px] font-bold bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-slate-400 transition-colors border border-slate-600">CLEAR</button>
            </div>
            <div id="terminal-output" class="p-3 h-32 overflow-y-auto font-mono text-xs text-emerald-400 space-y-1 bg-transparent break-words">
                <div class="text-slate-500 italic">Waiting for hardware SYNC...</div>
            </div>
        </div>

        <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 auto-rows-max items-start"></div>
    </div>

    <div class="fixed bottom-4 right-4 z-0 opacity-30 hover:opacity-100 transition-opacity flex items-center gap-2 pointer-events-none">
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Powered by</span>
        <img src="MAKEROBOT_ECO-Photoroom.jpg" alt="Makerobot Ecosystem" class="h-8 object-contain rounded mix-blend-screen pointer-events-auto">
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAMLoInCYEYyT97RtkjW6rnT0lKTu7_xik", authDomain: "makerlink-b575b.firebaseapp.com", databaseURL: "https://makerlink-b575b-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "makerlink-b575b", storageBucket: "makerlink-b575b.firebasestorage.app" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();

        let isCloudActive = false, cloudRoomId = null, cloudInterval = null;
        let isEditMode = false;
        
        let isMuted = false;
        const audioPlayers = {};
        const audioVolumes = {};
        
        let cardPermissions = {}; 
        let cardVisibility = JSON.parse(localStorage.getItem('makerlink_vis') || '{}');
        
        const advancedData = {}; const sensorCharts = {}; let activeCardTypes = {}; 
        
        const cardSizes = ['col-span-1', 'col-span-1 md:col-span-2', 'col-span-1 md:col-span-2 lg:col-span-3', 'col-span-1 md:col-span-2 lg:col-span-3 xl:col-span-4'];
        
        let bluetoothDevice, bluetoothServer, uartService, rxCharacteristic, txCharacteristic;
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e'; const UART_RX_CHAR_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; const UART_TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        let rxBuffer = ''; let commandQueue = []; let isTransmitting = false;

        const gridEl = document.getElementById('dashboard-grid');
        const sortable = new Sortable(gridEl, { animation: 150, ghostClass: 'sortable-ghost', disabled: true, filter: ".size-btns, input, select, button", preventOnFilter: false, onEnd: function (evt) { saveLayoutOrder(); } });

        function getSVGIcon(type) {
            if(type === 'analog') return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>`;
            if(type === 'digital') return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>`;
            if(type === 'motor') return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`;
            if(type === 'servo') return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>`;
            if(type === 'audio') return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"></path></svg>`;
            return `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`;
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('btn-mute');
            if (isMuted) {
                btn.innerHTML = "🔇 MUTED";
                btn.classList.replace("bg-slate-700/90", "bg-red-900/80");
                btn.classList.replace("border-slate-600/50", "border-red-800/50");
                for (let id in audioPlayers) { if (audioPlayers[id]) { audioPlayers[id].pause(); audioPlayers[id].currentTime = 0; } }
            } else {
                btn.innerHTML = "🔊 SOUND ON";
                btn.classList.replace("bg-red-900/80", "bg-slate-700/90");
                btn.classList.replace("border-red-800/50", "border-slate-600/50");
            }
        }

        function changeCardSize(id, delta) {
            let card = document.getElementById(`card-${id}`);
            if (!card) return;
            let currentSize = parseInt(card.getAttribute('data-size') || '0');
            currentSize += delta;
            if (currentSize < 0) currentSize = 0;
            if (currentSize >= cardSizes.length) currentSize = cardSizes.length - 1;
            card.setAttribute('data-size', currentSize);
            card.className = card.className.replace(/\b(md:|lg:|xl:)?col-span-\d\b/g, '').replace(/\s+/g, ' ').trim();
            let newClasses = cardSizes[currentSize].split(' ');
            card.classList.add(...newClasses);
            saveLayoutOrder();
        }

        function saveLayoutOrder() { 
            const finalOrder = []; const currentDOMIds = new Set();
            Array.from(gridEl.children).forEach(c => { 
                let id = c.id.replace('card-', ''); let size = c.getAttribute('data-size') || '0';
                currentDOMIds.add(id); finalOrder.push({ id: id, size: size }); 
            }); 
            const saved = JSON.parse(localStorage.getItem('makerlink_layout') || '[]'); 
            saved.forEach(item => { let id = typeof item === 'string' ? item : item.id; if (!currentDOMIds.has(id)) { finalOrder.push({ id: id, size: item.size || '0' }); } });
            localStorage.setItem('makerlink_layout', JSON.stringify(finalOrder)); 
            if (isCloudActive && cloudRoomId) { db.ref('rooms/' + cloudRoomId + '/layout').set(finalOrder); } 
        }
        
        function saveCustomLabels() { 
            let labels = JSON.parse(localStorage.getItem('makerlink_labels') || '{}'); 
            document.querySelectorAll('.ui-editable, .ui-btn-editable, .ui-editable-num').forEach(el => { 
                if(el.id) {
                    if (el.tagName === 'BUTTON') labels[el.id] = el.innerText.trim();
                    else labels[el.id] = el.value.trim();
                }
            }); 
            localStorage.setItem('makerlink_labels', JSON.stringify(labels)); 
        }

        function applyCustomLabels() { 
            let labels = JSON.parse(localStorage.getItem('makerlink_labels') || '{}'); 
            for(let id in labels) { 
                let el = document.getElementById(id); 
                if(el) { 
                    if (el.tagName === 'BUTTON') el.innerText = labels[id];
                    else {
                        el.value = labels[id]; 
                        if (el.hasAttribute('max')) {
                            let maxVal = parseFloat(el.getAttribute('max'));
                            let currentVal = parseFloat(el.value);
                            if (currentVal > maxVal) el.value = maxVal;
                            if (currentVal < 0) el.value = 0;
                        }
                    }
                } 
            } 
        }
        
        function applySavedLayout() { 
            const saved = JSON.parse(localStorage.getItem('makerlink_layout') || '[]'); 
            let needsReorder = false;
            let currentNodes = Array.from(gridEl.children);
            
            let validSaved = saved.filter(item => {
                let id = typeof item === 'string' ? item : item.id;
                return document.getElementById(`card-${id}`);
            });

            for (let i = 0; i < validSaved.length; i++) {
                let id = typeof validSaved[i] === 'string' ? validSaved[i] : validSaved[i].id;
                if (currentNodes[i] && currentNodes[i].id !== `card-${id}`) { needsReorder = true; break; }
            }

            validSaved.forEach(item => { 
                let id = typeof item === 'string' ? item : item.id; 
                const card = document.getElementById(`card-${id}`); 
                if (card) { 
                    let s = String(item.size || '0'); 
                    if (card.getAttribute('data-size') !== s) {
                        card.setAttribute('data-size', s);
                        card.className = card.className.replace(/\b(md:|lg:|xl:)?col-span-\d\b/g, '').replace(/\s+/g, ' ').trim();
                        let newClasses = cardSizes[parseInt(s)].split(' '); card.classList.add(...newClasses);
                    }
                    if (needsReorder) gridEl.appendChild(card); 
                } 
            }); 
        }

        function toggleEditMode() {
            isEditMode = !isEditMode; sortable.option("disabled", !isEditMode); const btn = document.getElementById('btn-edit');
            if (isEditMode) {
                document.body.classList.add('is-editing'); 
                btn.innerHTML = `Save Layout`; 
                btn.className = "active:scale-[0.97] transition-all bg-yellow-500/90 hover:bg-yellow-400 text-yellow-950 font-bold py-2.5 px-5 rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.5)] border border-yellow-400 min-w-[140px] flex items-center justify-center gap-2";
                document.querySelectorAll('select').forEach(el => { el.disabled = false; });
                
                document.querySelectorAll('.ui-editable, .ui-btn-editable, .ui-editable-num').forEach(el => { 
                    if (el.tagName === 'BUTTON') {
                        el.contentEditable = "true";
                    } else if (el.tagName !== 'SELECT') { 
                        el.removeAttribute('readonly'); 
                    } 
                    if(el.classList.contains('ui-btn-editable') || el.classList.contains('ui-editable-num') || el.tagName === 'BUTTON') { 
                        el.classList.remove('cursor-pointer'); 
                        el.classList.add('cursor-text', 'border-yellow-400/80', 'border-dashed', 'bg-yellow-900/40'); 
                    } 
                });
            } else {
                document.body.classList.remove('is-editing'); 
                btn.innerHTML = `Edit Layout`; 
                btn.className = "active:scale-[0.97] transition-all bg-slate-700/90 hover:bg-slate-600 text-white font-bold py-2.5 px-5 rounded-xl shadow-lg border border-slate-600/50 min-w-[140px] flex items-center justify-center gap-2";
                document.querySelectorAll('select').forEach(el => { el.disabled = true; });
                
                document.querySelectorAll('.ui-editable, .ui-btn-editable, .ui-editable-num').forEach(el => { 
                    if (el.tagName === 'BUTTON') {
                        el.contentEditable = "false";
                    } else if (el.tagName !== 'SELECT') { 
                        el.setAttribute('readonly', true); 
                    } 
                    if(el.classList.contains('ui-btn-editable') || el.classList.contains('ui-editable-num') || el.tagName === 'BUTTON') { 
                        el.classList.add('cursor-pointer'); 
                        el.classList.remove('cursor-text', 'border-yellow-400/80', 'border-dashed', 'bg-yellow-900/40'); 
                    } 
                });
                saveCustomLabels(); saveLayoutOrder(); 
            }
        }

        function clearDashboard() { 
            gridEl.innerHTML = ''; activeCardTypes = {}; cardPermissions = {}; cardVisibility = {}; 
            localStorage.removeItem('makerlink_layout'); localStorage.removeItem('makerlink_labels'); 
            localStorage.removeItem('makerlink_perms'); localStorage.removeItem('makerlink_vis'); 
            for (let id in audioPlayers) { if(audioPlayers[id]) audioPlayers[id].pause(); }
            appendTerminal("Dashboard cleared manually."); 
        }

        function pingBluetooth() {
            const p = document.getElementById('ping-indicator');
            if(!p) return; p.className = "w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.9)] transition-colors duration-75";
            clearTimeout(p.timer); p.timer = setTimeout(() => { p.className = "w-3 h-3 rounded-full bg-slate-700 transition-colors duration-300"; }, 150);
        }

        function getAnalogColor(val) { let r = Math.min(1, Math.max(0, val / 1023)); let red = Math.round(100 + r * 149); let green = Math.round(116 - r * 1); let blue = Math.round(139 - r * 117); return `rgb(${red}, ${green}, ${blue})`; }
        function showMsg(msg) { const box = document.getElementById('msg-box'); box.innerText = msg; box.classList.remove('opacity-0', 'pointer-events-none'); box.classList.add('opacity-100'); setTimeout(() => { box.classList.remove('opacity-100'); box.classList.add('opacity-0', 'pointer-events-none'); }, 4000); }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }
        
        function appendTerminal(msg, colorClassStr = null) { 
            const term = document.getElementById('terminal-output'); 
            if (term.innerHTML.includes("Waiting for hardware SYNC...")) term.innerHTML = ''; 
            const time = new Date().toLocaleTimeString('en-US', { hour12: false }); const line = document.createElement('div'); 
            let colorClass = colorClassStr || (msg.toLowerCase().includes('error') || msg.toLowerCase().includes('crash') || msg.toLowerCase().includes('fail') ? 'text-red-400 font-bold' : 'text-emerald-400'); 
            line.innerHTML = `<span class="text-slate-600 mr-2">[${time}]</span> <span class="${colorClass}">${escapeHTML(msg)}</span>`; 
            term.appendChild(line); term.scrollTop = term.scrollHeight; 
            if (isCloudActive && cloudRoomId) { db.ref('rooms/' + cloudRoomId + '/logs').push({ time: time, msg: msg, color: colorClass }); } 
        }

        function togglePermission(id) {
            cardPermissions[id] = !cardPermissions[id]; let btn = document.getElementById(`perm-btn-${id}`);
            if (btn) {
                if (cardPermissions[id]) { btn.innerText = "🎮 PUBLIC"; btn.className = "ml-2 text-[9px] font-bold tracking-wider border px-2 py-0.5 rounded cursor-pointer hover:opacity-80 transition-opacity bg-green-900/40 text-green-400 border-green-700/50 shadow-[0_0_8px_rgba(74,222,128,0.2)]"; } 
                else { btn.innerText = "👁️ VIEW ONLY"; btn.className = "ml-2 text-[9px] font-bold tracking-wider border px-2 py-0.5 rounded cursor-pointer hover:opacity-80 transition-opacity bg-red-900/40 text-red-400 border-red-700/50"; }
            }
            localStorage.setItem('makerlink_perms', JSON.stringify(cardPermissions)); if (isCloudActive) syncCloud();
        }

        function toggleVisibility(id) {
            cardVisibility[id] = cardVisibility[id] === false ? true : false; let btn = document.getElementById(`vis-btn-${id}`);
            if (btn) {
                if (cardVisibility[id]) { btn.innerText = "👁️ VISIBLE"; btn.className = "ml-2 text-[9px] font-bold tracking-wider border px-2 py-0.5 rounded cursor-pointer hover:opacity-80 transition-colors bg-blue-900/40 text-blue-400 border-blue-700/50"; } 
                else { btn.innerText = "🙈 HIDDEN"; btn.className = "ml-2 text-[9px] font-bold tracking-wider border px-2 py-0.5 rounded cursor-pointer hover:opacity-80 transition-colors bg-slate-800/50 text-slate-400 border-slate-600/50"; }
            }
            localStorage.setItem('makerlink_vis', JSON.stringify(cardVisibility)); if (isCloudActive) syncCloud();
        }

        function updateDigitalUI(id, val) {
            let v = Number(val); advancedData[id] = v; let valIn = document.getElementById(`val-${id}`);
            if(valIn) { 
                let lowText = 'LOW', highText = 'HIGH';
                let lowEl = document.getElementById(`label-low-${id}`);
                let highEl = document.getElementById(`label-high-${id}`);
                if(lowEl) lowText = lowEl.value || 'LOW';
                if(highEl) highText = highEl.value || 'HIGH';
                
                valIn.innerText = v === 1 ? highText : lowText; 
                
                if(v === 1) { valIn.style.backgroundColor = '#dc2626'; valIn.style.color = '#ffffff'; valIn.style.borderColor = '#f87171'; valIn.style.boxShadow = '0 0 25px rgba(220, 38, 38, 0.8)'; }

                                     <button id="btn-pos1-${id}" onclick="if(!isEditMode) setServoPos('${id}', 1)" class="ui-btn-editable w-full bg-blue-600/90 hover:bg-blue-500/90 text-white tracking-wider text-xs font-bold py-2 px-1 rounded-xl shadow-[0_0_12px_rgba(37,99,235,0.4)] active:scale-[0.97] transition-all border border-blue-500/50 cursor-pointer text-center focus:outline-none truncate mt-1">POS 1</button>
                                 </div>
                                 <div class="flex-1 flex flex-col gap-1.5">
                                     <label class="text-[9px] text-slate-500 tracking-wider text-center font-bold">LIMIT 2</label>
                                     <div class="w-full bg-black/30 border border-slate-700/50 rounded-lg px-2 py-1.5 text-center text-xs font-mono text-blue-400 shadow-inner mb-1" id="pos2-val-display-${id}">${p2}</div>
                                     <button id="btn-pos2-${id}" onclick="if(!isEditMode) setServoPos('${id}', 2)" class="ui-btn-editable w-full bg-blue-600/90 hover:bg-blue-500/90 text-white tracking-wider text-xs font-bold py-2 px-1 rounded-xl shadow-[0_0_12px_rgba(37,99,235,0.4)] active:scale-[0.97] transition-all border border-blue-500/50 cursor-pointer text-center focus:outline-none truncate mt-1">POS 2</button>
                                 </div>
                             </div>`;
                }
                else if (type === 'audio') {
                    html += `<div class="w-full flex-1 flex flex-col items-center justify-center relative">
                                 <div id="audio-icon-${id}" class="w-24 h-24 rounded-full bg-black/40 border-4 border-slate-700/50 flex items-center justify-center transition-all duration-300 shadow-lg z-10">
                                     <svg class="w-10 h-10 text-slate-500 transition-colors duration-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z"></path></svg>
                                 </div>
                                 <div id="audio-ring-${id}" class="absolute w-24 h-24 rounded-full border-[6px] border-cyan-400 opacity-0 transition-all duration-300 pointer-events-none"></div>
                             </div>
                             <div id="audio-status-${id}" class="text-xs font-bold tracking-widest text-slate-500 mb-3 text-center uppercase w-full">STATUS: IDLE</div>
                             <div class="flex items-center gap-3 w-full mb-4 bg-black/20 p-2 rounded-xl border border-slate-700/50">
                                 <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                                 <input type="range" id="vol-${id}" min="0" max="1" step="0.1" value="0.5" oninput="updateVolume('${id}', this.value)" class="flex-1">
                             </div>
                             <button id="btn-stop-${id}" onclick="if(!isEditMode) stopRemoteAudio('${id}')" class="ui-btn-editable w-full bg-red-600/90 hover:bg-red-500/90 text-white tracking-wider text-sm font-bold py-3 px-2 rounded-xl shadow-[0_0_15px_rgba(220,38,38,0.3)] active:scale-[0.97] transition-all border border-red-500/50 cursor-pointer text-center focus:outline-none truncate">⏹️ STOP ALARM</button>`;
                }

                html += `</div><div class="p-3 bg-black/20 border-t ${borderTheme} rounded-b-2xl flex justify-center"><input type="text" id="title-${id}" value="Custom Label" readonly class="ui-editable w-full font-bold text-xs tracking-widest text-slate-400 uppercase bg-transparent border-none outline-none focus:ring-1 focus:ring-slate-500 rounded-md text-center placeholder-slate-600 cursor-pointer truncate" placeholder="NAME THIS CARD..."></div>`;

                card.innerHTML = html; gridEl.appendChild(card);
                
                if (type === 'analog' && mode === 'IN') { initChart(id); if(startVals) document.getElementById(`val-${id}`).style.color = getAnalogColor(Number(startVals[0])); }
                if (type === 'analog' && mode === 'OUT') updateAnalogOutUI(id, startVals ? startVals[0] : 0);
                if (type === 'digital') updateDigitalUI(id, startVals ? startVals[0] : 0);
                if (type === 'text' && mode !== 'OUT' && startVals) updateTextUI(id, startVals[0]);

                applySavedLayout(); applyCustomLabels(); saveLayoutOrder(); 
            } catch (err) {
                appendTerminal("UI BUILD ERROR: " + err.message);
                console.error("UI Build Error:", err);
            }
        }

        async function sendBluetoothCommand(cmd) { if (!txCharacteristic) { return; } commandQueue.push(cmd); processCommandQueue(); }
        async function processCommandQueue() { if (isTransmitting || commandQueue.length === 0) return; isTransmitting = true; const cmd = commandQueue.shift(); try { let data = new TextEncoder().encode(cmd + '\n'); if (txCharacteristic.properties.writeWithoutResponse) { await txCharacteristic.writeValueWithoutResponse(data); } else { await txCharacteristic.writeValue(data); } } catch (err) {} finally { isTransmitting = false; if (commandQueue.length > 0) { setTimeout(processCommandQueue, 10); } } }

        async function connectBluetooth() {
            if (!navigator || !navigator.bluetooth) { showMsg("Web Bluetooth API is missing! Use Chrome or Edge."); return; }
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'BBC micro:bit' }], optionalServices: [UART_SERVICE_UUID] });
                bluetoothServer = await bluetoothDevice.gatt.connect(); uartService = await bluetoothServer.getPrimaryService(UART_SERVICE_UUID);
                txCharacteristic = await uartService.getCharacteristic(UART_TX_CHAR_UUID); rxCharacteristic = await uartService.getCharacteristic(UART_RX_CHAR_UUID);
                await rxCharacteristic.startNotifications(); rxCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                const btn = document.getElementById("btnConnect"); 
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Connected`; 
                btn.className = "active:scale-[0.97] transition-all bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.5)] border border-emerald-500/50 flex items-center gap-2";
                setTimeout(() => { sendBluetoothCommand('SYNC'); appendTerminal("Hardware connected. Processing SYNC data..."); }, 300);

                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    const btn = document.getElementById("btnConnect"); 
                    btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Connect`; 
                    btn.className = "active:scale-[0.97] transition-all bg-blue-600/90 hover:bg-blue-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] border border-blue-500/50 flex items-center gap-2";
                    showMsg("Hardware disconnected!"); appendTerminal("Error: Connection lost. Dashboard cleared.");
                    const p = document.getElementById('ping-indicator');
                    if(p) { clearTimeout(p.timer); p.className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_12px_rgba(239,68,68,0.9)] transition-colors duration-300"; }
                    commandQueue = []; isTransmitting = false; gridEl.innerHTML = ''; activeCardTypes = {}; if (isCloudActive) syncCloud(); 
                });
            } catch (error) { showMsg("Connection failed or cancelled."); }
        }

        function handleIncomingData(event) {
            pingBluetooth();
            let value = new TextDecoder().decode(event.target.value); rxBuffer += value; let lines = rxBuffer.split('\n');
            while(lines.length > 1) { 
                let line = lines.shift().trim();
                try {
                    if (line.startsWith("LOG:")) { appendTerminal(line.substring(4)); } 
                    else if (line.startsWith("INIT:")) {
                        let params = line.substring(5).split(","); let id = params[0];
                        if(id.startsWith("M")) createPlayingCard(id, 'motor', null, [params[2], params[3], params[4]]);
                        else if(id.startsWith("S")) createPlayingCard(id, 'servo', null, [params[2], params[3], params[4]]);
                        else if(id.startsWith("T")) createPlayingCard(id, 'text', params[1] === 'OUT' ? 'OUT' : null, [params[2]]);
                        else if(id.startsWith("A")) createPlayingCard(id, 'analog', params[1], [params[2]]);
                        else if(id.startsWith("D")) createPlayingCard(id, 'digital', params[1], [params[2]]);
                        else if(id.startsWith("B")) createPlayingCard(id, 'audio', null, [params[2]]);
                    } else if (line !== "") { parseTelemetry(line); }
                } catch (err) {
                    appendTerminal("DATA PARSE ERROR: " + err.message);
                }
            }
            rxBuffer = lines[0];
        }

        function parseTelemetry(str) {
            let splitIdx = str.indexOf(':'); if(splitIdx === -1) return;
            let id = str.substring(0, splitIdx); let valStr = str.substring(splitIdx + 1);
            let cardData = activeCardTypes[id]; if (!cardData) return; advancedData[id] = valStr;

            if (cardData.type === 'text') { 
                if (cardData.mode === 'OUT') {
                    let el = document.getElementById(`text-input-${id}`); if(el) el.value = valStr;
                } else {
                    updateTextUI(id, valStr); 
                }
            } 
            else if (cardData.type === 'audio') {
                if (valStr.startsWith('PLAY')) {
                    let parts = valStr.split(':');
                    let soundType = parts[1] || 'BEEP'; let mode = parts[2] || 'ONCE';

                    if(audioPlayers[id]) { audioPlayers[id].pause(); }

                    let url = 'https://actions.google.com/sounds/v1/alarms/beep_short.ogg';
                    if(soundType === 'SIREN') url = 'https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg';
                    if(soundType === 'CHIME') url = 'https://actions.google.com/sounds/v1/doors/elevator_ding.ogg';

                    let audio = new Audio(url);
                    audio.loop = (mode === 'LOOP');
                    audio.volume = audioVolumes[id] !== undefined ? audioVolumes[id] : 0.5;
                    
                    if(!isMuted) { audio.play().catch(e=>console.log(e)); }
                    audioPlayers[id] = audio;

                    let icon = document.getElementById(`audio-icon-${id}`); let ring = document.getElementById(`audio-ring-${id}`); let stat = document.getElementById(`audio-status-${id}`);
                    if(icon) { icon.classList.add('border-cyan-400', 'bg-cyan-900/60', 'shadow-[0_0_25px_rgba(34,211,238,0.5)]'); icon.querySelector('svg').classList.replace('text-slate-500', 'text-cyan-400'); }
                    if(ring) { ring.classList.add('animate-ping', 'opacity-100'); }
                    if(stat) { stat.innerText = `STATUS: PLAYING (${soundType})`; stat.classList.replace('text-slate-500', 'text-cyan-400'); }
                } else if (valStr === 'STOP') {
                    if(audioPlayers[id]) { audioPlayers[id].pause(); audioPlayers[id].currentTime = 0; }
                    let icon = document.getElementById(`audio-icon-${id}`); let ring = document.getElementById(`audio-ring-${id}`); let stat = document.getElementById(`audio-status-${id}`);
                    if(icon) { icon.classList.remove('border-cyan-400', 'bg-cyan-900/60', 'shadow-[0_0_25px_rgba(34,211,238,0.5)]'); icon.querySelector('svg').classList.replace('text-cyan-400', 'text-slate-500'); }
                    if(ring) { ring.classList.remove('animate-ping', 'opacity-100'); }
                    if(stat) { stat.innerText = `STATUS: IDLE`; stat.classList.replace('text-cyan-400', 'text-slate-500'); }
                }
                if (isCloudActive) syncCloud(); // Force sync so Public hears it too!
            }
            else {
                let valNum = Number(valStr); if(isNaN(valNum)) valNum = 0;
                
                if (cardData.type === 'analog' && cardData.mode === 'IN') { let el = document.getElementById(`val-${id}`); if(el) { el.innerText = valNum; el.style.color = getAnalogColor(valNum); pushChartData(id, valNum); } } 
                else if (cardData.type === 'analog' && cardData.mode === 'OUT') { updateAnalogOutUI(id, valNum); }
                else if (cardData.type === 'digital') { updateDigitalUI(id, valNum); }
                else if (cardData.type === 'motor') { 
                    let el = document.getElementById(`val-${id}`); 
                    if (el) { 
                        let displayStr = 'STOP (0)';
                        if (valNum !== 0) {
                            if (id === 'M1' || id === 'M2') displayStr = valNum < 0 ? `CW (${Math.abs(valNum)})` : `CCW (${Math.abs(valNum)})`;
                            else displayStr = valNum > 0 ? `CW (${Math.abs(valNum)})` : `CCW (${Math.abs(valNum)})`;
                        }
                        el.innerText = displayStr; 
                    } 
                }
                else if (cardData.type === 'servo') { let el = document.getElementById(`slider-${id}`); if(el) el.value = valNum; let valEl = document.getElementById(`val-${id}`); if(valEl) valEl.innerText = valNum + '°'; }
            }
        }

        function toggleCloud() {
            isCloudActive = !isCloudActive; const btn = document.getElementById('btn-cloud');
            if (isCloudActive) {
                cloudRoomId = Math.floor(1000 + Math.random() * 9000);
                btn.innerHTML = `<svg class="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> Live: ${cloudRoomId}`; 
                btn.className = "active:scale-[0.97] transition-all bg-red-600/90 hover:bg-red-500 text-white font-bold py-2.5 px-5 rounded-xl min-w-[140px] shadow-[0_0_20px_rgba(220,38,38,0.6)] border border-red-500 flex items-center justify-center gap-2";
                db.ref('rooms/' + cloudRoomId).remove(); saveLayoutOrder(); 
                
                db.ref('rooms/' + cloudRoomId + '/command').on('child_added', (snap) => { 
                    const cmdData = snap.val(); 
                    if(cmdData && cmdData.cmd) { 
                        if (cmdData.cmd.includes(':POS1')) { setServoPos(cmdData.cmd.split(':')[0], 1); }
                        else if (cmdData.cmd.includes(':POS2')) { setServoPos(cmdData.cmd.split(':')[0], 2); }
                        else if (cmdData.cmd.includes(':STOP') && cmdData.cmd.startsWith('B')) { stopRemoteAudio(cmdData.cmd.split(':')[0]); }
                        else { sendBluetoothCommand(cmdData.cmd); parseTelemetry(cmdData.cmd); }
                    } 
                });
                cloudInterval = setInterval(syncCloud, 400); appendTerminal(`Cloud stream active. Room ID: ${cloudRoomId}`);
            } else {
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg> Go Public`; 
                btn.className = "active:scale-[0.97] transition-all bg-purple-600/90 hover:bg-purple-500 text-white font-bold py-2.5 px-5 rounded-xl shadow-[0_0_15px_rgba(147,51,234,0.4)] border border-purple-500/50 min-w-[140px] flex items-center justify-center gap-2";
                clearInterval(cloudInterval); if(cloudRoomId) { db.ref('rooms/' + cloudRoomId).remove(); } appendTerminal("Cloud stream closed.");
            }
        }

        function syncCloud() {
            try {
                const payload = [];
                db.ref('rooms/' + cloudRoomId + '/config').set({ terminalVisible: cardVisibility['terminal'] !== false });
                db.ref('rooms/' + cloudRoomId + '/heartbeat').set(Date.now());

                Array.from(gridEl.children).forEach(cardDom => {
                    let id = cardDom.id.replace('card-', ''); 
                    let info = activeCardTypes[id];
                    if(cardVisibility[id] === false) return; 

                    if(info) {
                        let cVal = advancedData[id];
                        let finalVal = 0;
                        if (info.type === 'text' || info.type === 'audio') {
                            finalVal = String(cVal || "");
                        } else {
                            finalVal = Number(cVal);
                            if (isNaN(finalVal) || !isFinite(finalVal)) finalVal = 0;
                        }

                        let titleEl = document.getElementById(`title-${id}`);
                        let cardData = {
                            id: String(id), 
                            type: String(info.type), 
                            mode: info.mode ? String(info.mode) : "",
                            val: finalVal,
                            title: titleEl ? String(titleEl.value) : "Label"
                        };
                        
                        let isOut = (info.type === 'analog' && info.mode === 'OUT') || (info.type === 'digital' && (info.mode === 'OUT' || info.mode === 'PUSH')) || (info.type === 'text' && info.mode === 'OUT') || info.type === 'motor' || info.type === 'servo' || info.type === 'audio';
                        if (isOut) { cardData.publicControl = cardPermissions[id] !== false; }

                        if (info.type === 'analog' && info.mode === 'IN') {
                            let timeEl = document.getElementById(`time-${id}`);
                            let yminEl = document.getElementById(`ymin-${id}`);
                            let ymaxEl = document.getElementById(`ymax-${id}`);
                            cardData.time = timeEl ? String(timeEl.value) : "0";
                            cardData.ymin = yminEl ? String(yminEl.value) : "";
                            cardData.ymax = ymaxEl ? String(ymaxEl.value) : "";
                        } else if (info.type === 'digital' && info.mode === 'IN') {
                            let lLow = document.getElementById(`label-low-${id}`);
                            let lHigh = document.getElementById(`label-high-${id}`);
                            cardData.labelLow = lLow ? String(lLow.value) : "LOW";
                            cardData.labelHigh = lHigh ? String(lHigh.value) : "HIGH";
                        } else if (info.type === 'servo') {
                            let d1 = document.getElementById(`pos1-val-display-${id}`);
                            let d2 = document.getElementById(`pos2-val-display-${id}`);
                            cardData.pos1Val = d1 ? (Number(d1.innerText) || 0) : 0; 
                            cardData.pos2Val = d2 ? (Number(d2.innerText) || 180) : 180;
                            
                            let btnP1 = document.getElementById(`btn-pos1-${id}`);
                            let btnP2 = document.getElementById(`btn-pos2-${id}`);
                            cardData.btnPos1 = btnP1 ? String(btnP1.innerText) : "POS 1";
                            cardData.btnPos2 = btnP2 ? String(btnP2.innerText) : "POS 2";
                        } else if (info.type === 'motor') {
                            let cwSpd = document.getElementById(`cw-spd-${id}`);
                            let ccwSpd = document.getElementById(`ccw-spd-${id}`);
                            cardData.cwSpd = cwSpd ? (Number(cwSpd.value) || 255) : 255; 
                            cardData.ccwSpd = ccwSpd ? (Number(ccwSpd.value) || 255) : 255;
                            cardData.cwLimit = cwSpd ? (Number(cwSpd.max) || 255) : 255; 
                            cardData.ccwLimit = ccwSpd ? (Number(ccwSpd.max) || 255) : 255;
                            
                            let bCw = document.getElementById(`btn-cw-${id}`);
                            let bCcw = document.getElementById(`btn-ccw-${id}`);
                            let bStop = document.getElementById(`btn-stop-${id}`);
                            cardData.btnCw = bCw ? String(bCw.innerText) : "CW ⏩";
                            cardData.btnCcw = bCcw ? String(bCcw.innerText) : "⏪ CCW";
                            cardData.btnStop = bStop ? String(bStop.innerText) : "⏹️ STOP";
                        } else if (info.type === 'digital' && info.mode === 'OUT') {
                            let bOn = document.getElementById(`btn-on-${id}`);
                            let bOff = document.getElementById(`btn-off-${id}`);
                            cardData.btnOn = bOn ? String(bOn.innerText) : "ON";
                            cardData.btnOff = bOff ? String(bOff.innerText) : "OFF";
                        } else if (info.type === 'digital' && info.mode === 'PUSH') {
                            let bPush = document.getElementById(`btn-push-${id}`);
                            cardData.btnPush = bPush ? String(bPush.innerText) : "HOLD";
                        } else if (info.type === 'text' && info.mode === 'OUT') {
                            let bSend = document.getElementById(`btn-send-${id}`);
                            cardData.btnSend = bSend ? String(bSend.innerText) : "SEND";
                            let tInp = document.getElementById(`text-input-${id}`);
                            cardData.val = tInp ? String(tInp.value) : "";
                        }
                        
                        payload.push(JSON.parse(JSON.stringify(cardData)));
                    }
                });
                
                if (payload.length === 0) { db.ref('rooms/' + cloudRoomId + '/state').set({ empty: true }).catch(e=>console.log(e)); } 
                else { db.ref('rooms/' + cloudRoomId + '/state').set(payload).catch(e=>console.log(e)); }
            } catch (err) {
                console.error("Sync Error:", err);
            }
        }
        
        function initChart(id) { 
            let canvas = document.getElementById(`chart-${id}`);
            if(!canvas) return;
            const ctx = canvas.getContext('2d'); 
            sensorCharts[id] = new Chart(ctx, { 
                type: 'line', 
                data: { labels: [], datasets: [{ data: [], borderColor: '#c084fc', tension: 0.3, pointRadius: 0, borderWidth: 2, fill: true, backgroundColor: 'rgba(192, 132, 252, 0.1)' }] }, 
                options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } } 
            }); 
        }
        
        function updateChartConfig(id) {
            let yMinEl = document.getElementById(`ymin-${id}`);
            let yMaxEl = document.getElementById(`ymax-${id}`);
            if(!yMinEl || !yMaxEl) return;
            const yMin = yMinEl.value; 
            const yMax = yMaxEl.value; 
            if(sensorCharts[id]) { 
                if (yMin === "") delete sensorCharts[id].options.scales.y.min; else sensorCharts[id].options.scales.y.min = parseFloat(yMin); 
                if (yMax === "") delete sensorCharts[id].options.scales.y.max; else sensorCharts[id].options.scales.y.max = parseFloat(yMax); 
                sensorCharts[id].update('none'); 
            }
        }
        
        function pushChartData(id, val) { 
            if(!sensorCharts[id]) return; 
            const chart = sensorCharts[id]; 
            const timeEl = document.getElementById(`time-${id}`); 
            const windowMs = (timeEl && timeEl.value !== "") ? parseInt(timeEl.value) : 0; 
            
            let now = Date.now(); 
            chart.data.labels.push(now); 
            chart.data.datasets[0].data.push(val); 
            
            if(windowMs > 0) { 
                let cutoff = now - windowMs; 
                while(chart.data.labels.length > 0 && chart.data.labels[0] < cutoff) { 
                    chart.data.labels.shift(); 
                    chart.data.datasets[0].data.shift(); 
                } 
            } else {
                if (chart.data.labels.length > 200) { 
                    chart.data.labels.shift(); 
                    chart.data.datasets[0].data.shift(); 
                }
            }
            chart.update('none'); 
        }
    </script>
