<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLink Host</title>
    <link rel="icon" href="MakerLink Logo.jpg" type="image/jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #38bdf8; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #334155; border-radius: 4px; }
        
        body.is-editing .ui-editable { border-bottom: 1px dashed #facc15; border-radius: 0; cursor: text !important; }
        body:not(.is-editing) .ui-editable { border-bottom: 1px solid transparent; }
        
        body:not(.is-editing) .maker-card { cursor: default; }
        body.is-editing .maker-card { cursor: grab; }
        body.is-editing .maker-card:active { cursor: grabbing; }
        
        .size-btns { display: none; }
        body.is-editing .size-btns { display: flex; }
        
        #msg-box { transition: opacity 0.3s, transform 0.3s; }
        
        #terminal-output::-webkit-scrollbar, .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        #terminal-output::-webkit-scrollbar-track, .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px; }
        #terminal-output::-webkit-scrollbar-thumb, .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .maker-card { width: 320px; max-width: 100%; height: 380px; flex-shrink: 0; display: flex; flex-direction: column; transition: width 0.3s ease; }
        
        .sortable-ghost { opacity: 0.4; }
        select { padding-right: 0 !important; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-4 md:p-6 overflow-x-hidden relative">

    <div id="msg-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl z-50 opacity-0 pointer-events-none font-bold text-center border-2 border-red-400">Message</div>

    <header class="flex flex-col xl:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 mb-6 gap-6 xl:gap-0 shrink-0 relative z-10">
        <div class="flex items-center gap-4">
            <img src="MakerLink Logo.jpg" alt="MakerLink Logo" class="h-16 md:h-20 object-contain rounded-lg shadow-md mix-blend-screen">
            <div class="flex flex-col justify-center">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 leading-tight">MakerLink Host</h1>
                    <div id="ping-indicator" class="w-3 h-3 rounded-full bg-slate-700 transition-colors duration-300" title="Bluetooth Activity"></div>
                </div>
                <p class="text-emerald-400 text-sm font-bold tracking-wide mt-1">Simplifying cyber-physical prototyping</p>
            </div>
        </div>
        <div class="flex flex-wrap gap-3 justify-center">
            <button id="btnConnect" onclick="connectBluetooth()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-lg">🔌 Connect</button>
            <button id="btn-edit" onclick="toggleEditMode()" class="bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg">✏️ Edit Layout</button>
            <button id="btn-cloud" onclick="toggleCloud()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg">☁️ Go Public</button>
            <button id="btn-clear" onclick="clearDashboard()" class="bg-red-900 hover:bg-red-800 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[130px] shadow-lg">🗑️ Clear</button>
        </div>
    </header>

    <div class="flex flex-col gap-8 flex-1 pb-20 relative z-10">
        <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg flex flex-col mb-2">
            <div class="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-900/50 rounded-t-xl">
                <div class="flex items-center gap-2">
                    <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2">💻 System Terminal</h3>
                    <button id="vis-btn-terminal" onclick="toggleVisibility('terminal')" class="ml-2 text-[10px] border px-1.5 py-0.5 rounded cursor-pointer hover:opacity-80 transition-colors bg-blue-900/50 text-blue-400 border-blue-700" title="Toggle Public Visibility">👁️</button>
                </div>
                <button onclick="document.getElementById('terminal-output').innerHTML='<div class=\'text-slate-600 italic\'>Logs cleared.</div>'" class="text-[10px] font-bold bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-slate-300 transition-colors shadow-inner">CLEAR</button>
            </div>
            <div id="terminal-output" class="p-3 h-32 overflow-y-auto font-mono text-xs text-emerald-400 space-y-1 bg-[#0a0f18] rounded-b-xl break-words shadow-inner">
                <div class="text-slate-600 italic">Waiting for micro:bit SYNC...</div>
            </div>
        </div>

        <div id="dashboard-grid" class="flex flex-wrap gap-6 justify-center sm:justify-start"></div>
    </div>

    <div class="fixed bottom-4 right-4 z-0 opacity-40 hover:opacity-100 transition-opacity flex items-center gap-2 pointer-events-none">
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Powered by</span>
        <img src="MAKEROBOT_ECO-Photoroom.jpg" alt="Makerobot Ecosystem" class="h-8 object-contain rounded mix-blend-screen pointer-events-auto">
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAMLoInCYEYyT97RtkjW6rnT0lKTu7_xik", authDomain: "makerlink-b575b.firebaseapp.com", databaseURL: "https://makerlink-b575b-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "makerlink-b575b", storageBucket: "makerlink-b575b.firebasestorage.app" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();

        let isCloudActive = false, cloudRoomId = null, cloudInterval = null;
        let isEditMode = false;
        
        let cardPermissions = {}; 
        let cardVisibility = JSON.parse(localStorage.getItem('makerlink_vis') || '{}');
        
        const advancedData = {}; const sensorCharts = {}; let activeCardTypes = {}; 
        
        const cardSizes = ['320px', '664px', '1008px', '1352px'];
        
        let bluetoothDevice, bluetoothServer, uartService, rxCharacteristic, txCharacteristic;
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e'; const UART_RX_CHAR_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; const UART_TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        let rxBuffer = ''; let commandQueue = []; let isTransmitting = false;

        const gridEl = document.getElementById('dashboard-grid');
        
        const sortable = new Sortable(gridEl, { animation: 150, ghostClass: 'sortable-ghost', disabled: true, filter: ".size-btns, input, select, button", preventOnFilter: false, onEnd: function (evt) { saveLayoutOrder(); } });

        if (cardVisibility['terminal'] === false) {
            let tBtn = document.getElementById('vis-btn-terminal');
            if(tBtn) {
                tBtn.innerText = "🙈";
                tBtn.className = "ml-2 text-[10px] border px-1.5 py-0.5 rounded cursor-pointer hover:opacity-80 transition-colors bg-slate-700/50 text-slate-400 border-slate-600";
            }
        }
        
        function changeCardSize(id, delta) {
            let card = document.getElementById(`card-${id}`);
            if (!card) return;
            let currentSize = parseInt(card.getAttribute('data-size') || '0');
            currentSize += delta;
            
            if (currentSize < 0) currentSize = 0;
            if (currentSize >= cardSizes.length) currentSize = cardSizes.length - 1;
            
            card.setAttribute('data-size', currentSize);
            card.style.width = cardSizes[currentSize];
            
            saveLayoutOrder();
        }

        function updateServoLimits(id) {
            let p1El = document.getElementById(`pos1-val-${id}`);
            let p2El = document.getElementById(`pos2-val-${id}`);
            if(!p1El || !p2El) return;
            
            let p1 = parseInt(p1El.value) || 0;
            let p2 = parseInt(p2El.value) || 180;
            
            let outOfBounds = false;
            if(p1 < 0) { p1 = 0; outOfBounds = true; }
            if(p1 > 180) { p1 = 180; outOfBounds = true; }
            if(p2 < 0) { p2 = 0; outOfBounds = true; }
            if(p2 > 180) { p2 = 180; outOfBounds = true; }

            if(outOfBounds) {
                showMsg(`⚠️ Servo limits must be between 0° and 180°`);
                p1El.value = p1;
                p2El.value = p2;
            }

            let sl = document.getElementById(`slider-${id}`);
            if(sl) {
                sl.min = Math.min(p1, p2);
                sl.max = Math.max(p1, p2);
                
                let cVal = parseInt(sl.value);
                let bounded = Math.max(sl.min, Math.min(sl.max, cVal));
                if(cVal !== bounded) {
                    sl.value = bounded;
                    updateVal(id, bounded);
                    sendBluetoothCommand(`${id}:${bounded}`);
                    showMsg(`⚠️ Angle clamped to ${bounded}° (Hardware Limit)`);
                }
            }
            if(isCloudActive) syncCloud();
        }

        function pingBluetooth() {
            const p = document.getElementById('ping-indicator');
            if(!p) return;
            p.className = "w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)] transition-colors duration-75";
            clearTimeout(p.timer);
            p.timer = setTimeout(() => {
                p.className = "w-3 h-3 rounded-full bg-slate-700 transition-colors duration-300";
            }, 150);
        }

        function getAnalogColor(val) {
            let r = Math.min(1, Math.max(0, val / 1023));
            let red = Math.round(100 + r * 149);
            let green = Math.round(116 - r * 1);
            let blue = Math.round(139 - r * 117);
            return `rgb(${red}, ${green}, ${blue})`;
        }

        function getAnalogOutColor(val) {
            let r = Math.min(1, Math.max(0, val / 1023));
            let red = Math.round(100 - r * 41);
            let green = Math.round(116 + r * 14);
            let blue = Math.round(139 + r * 107);
            return `rgb(${red}, ${green}, ${blue})`;
        }

        function saveLayoutOrder() { 
            const order = Array.from(gridEl.children).map(c => { 
                return { id: c.id.replace('card-', ''), size: c.getAttribute('data-size') || '0' }; 
            }); 
            localStorage.setItem('makerlink_layout', JSON.stringify(order)); 
            if (isCloudActive && cloudRoomId) { db.ref('rooms/' + cloudRoomId + '/layout').set(order); } 
        }
        
        function saveCustomLabels() { let labels = {}; document.querySelectorAll('.ui-editable, .ui-btn-editable, .ui-editable-num').forEach(el => { if(el.id) labels[el.id] = el.value; }); localStorage.setItem('makerlink_labels', JSON.stringify(labels)); }
        function applyCustomLabels() { let labels = JSON.parse(localStorage.getItem('makerlink_labels') || '{}'); for(let id in labels) { let el = document.getElementById(id); if(el) { el.value = labels[id]; if (el.onchange) el.onchange(); } } }
        
        function applySavedLayout() { 
            const saved = JSON.parse(localStorage.getItem('makerlink_layout') || '[]'); 
            saved.forEach(item => { 
                let id = typeof item === 'string' ? item : item.id; 
                const card = document.getElementById(`card-${id}`); 
                if (card) { 
                    let s = item.size || '0';
                    card.setAttribute('data-size', s);
                    card.style.width = cardSizes[parseInt(s)];
                    gridEl.appendChild(card); 
                } 
            }); 
        }

        function showMsg(msg) { const box = document.getElementById('msg-box'); box.innerText = msg; box.classList.remove('opacity-0', 'pointer-events-none'); box.classList.add('opacity-100'); setTimeout(() => { box.classList.remove('opacity-100'); box.classList.add('opacity-0', 'pointer-events-none'); }, 4000); }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }
        function appendTerminal(msg) { const term = document.getElementById('terminal-output'); if (term.innerHTML.includes("Waiting for micro:bit SYNC...")) term.innerHTML = ''; const time = new Date().toLocaleTimeString('en-US', { hour12: false }); const line = document.createElement('div'); let colorClass = msg.toLowerCase().includes('error') || msg.toLowerCase().includes('fail') ? 'text-red-400' : 'text-emerald-400'; line.innerHTML = `<span class="text-slate-600 mr-2">[${time}]</span> <span class="${colorClass}">${escapeHTML(msg)}</span>`; term.appendChild(line); term.scrollTop = term.scrollHeight; if (isCloudActive && cloudRoomId) { db.ref('rooms/' + cloudRoomId + '/logs').push({ time: time, msg: msg, color: colorClass }); } }

        function togglePermission(id) {
            cardPermissions[id] = !cardPermissions[id];
            let btn = document.getElementById(`perm-btn-${id}`);
            if (btn) {
                if (cardPermissions[id]) {
                    btn.innerText = "🎮 Public";
                    btn.className = "ml-2 text-[10px] border px-1.5 py-0.5 rounded cursor-pointer hover:opacity-80 transition-opacity bg-green-900/50 text-green-400 border-green-700";
                } else {
                    btn.innerText = "👁️ View Only";
                    btn.className = "ml-2 text-[10px] border px-1.5 py-0.5 rounded cursor-pointer hover:opacity-80 transition-opacity bg-red-900/50 text-red-400 border-red-700";
                }
            }
            localStorage.setItem('makerlink_perms', JSON.stringify(cardPermissions));
            if (isCloudActive) syncCloud();
        }

        function toggleVisibility(id) {
            cardVisibility[id] = cardVisibility[id] === false ? true : false;
            let btn = document.getElementById(`vis-btn-${id}`);
            if (btn) {
                if (cardVisibility[id]) {
                    btn.innerText = "👁️";
                    btn.className = "ml-2 text-[10px] border px-1.5 py-0.5 rounded cursor-pointer hover:opacity-80 transition-colors bg-blue-900/50 text-blue-400 border-blue-700";
                } else {
                    btn.innerText = "🙈";
                    btn.className = "ml-2 text-[10px] border px-1.5 py-0.5 rounded cursor-pointer hover:opacity-80 transition-colors bg-slate-700/50 text-slate-400 border-slate-600";
                }
            }
            localStorage.setItem('makerlink_vis', JSON.stringify(cardVisibility));
            if (isCloudActive) syncCloud();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode; sortable.option("disabled", !isEditMode); 
            const btn = document.getElementById('btn-edit');
            if (isEditMode) {
                document.body.classList.add('is-editing'); btn.innerHTML = "💾 Save Layout"; btn.className = "bg-yellow-500 hover:bg-yellow-400 text-yellow-950 font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-[0_0_15px_rgba(234,179,8,0.4)]";
                
                document.querySelectorAll('.ui-editable, .ui-btn-editable, .ui-editable-num').forEach(el => { 
                    if(el.tagName === 'SELECT') { el.disabled = false; } 
                    else { el.removeAttribute('readonly'); }
                    
                    if(el.classList.contains('ui-btn-editable') || el.classList.contains('ui-editable-num')) { 
                        el.classList.remove('cursor-pointer'); el.classList.add('cursor-text', 'border-yellow-400', 'border-dashed'); 
                    } 
                });
            } else {
                document.body.classList.remove('is-editing'); btn.innerHTML = "✏️ Edit Layout"; btn.className = "bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg";
                
                document.querySelectorAll('.ui-editable, .ui-btn-editable, .ui-editable-num').forEach(el => { 
                    if(el.tagName === 'SELECT') { el.disabled = true; } 
                    else { el.setAttribute('readonly', true); }
                    
                    if(el.classList.contains('ui-btn-editable') || el.classList.contains('ui-editable-num')) { 
                        el.classList.add('cursor-pointer'); el.classList.remove('cursor-text', 'border-yellow-400', 'border-dashed'); 
                    } 
                });
                saveCustomLabels(); saveLayoutOrder(); 
            }
        }

        function clearDashboard() { 
            gridEl.innerHTML = ''; activeCardTypes = {}; cardPermissions = {}; cardVisibility = {}; 
            localStorage.removeItem('makerlink_layout'); localStorage.removeItem('makerlink_labels'); 
            localStorage.removeItem('makerlink_perms'); localStorage.removeItem('makerlink_vis'); 
            appendTerminal("Dashboard cleared manually."); 
        }

        function updateDigitalUI(id, val) {
            let v = Number(val); advancedData[id] = v; let valIn = document.getElementById(`val-${id}`);
            if(valIn) { 
                valIn.innerText = v === 1 ? 'HIGH' : 'LOW'; 
                if(v === 1) { valIn.style.backgroundColor = '#dc2626'; valIn.style.color = '#ffffff'; valIn.style.borderColor = '#f87171'; valIn.style.boxShadow = '0 0 25px rgba(220, 38, 38, 0.8)'; } 
                else { valIn.style.backgroundColor = '#0f172a'; valIn.style.color = '#64748b'; valIn.style.borderColor = '#1e293b'; valIn.style.boxShadow = 'inset 0 4px 6px rgba(0, 0, 0, 0.6)'; } 
            }
            
            let valOut = document.getElementById(`val-out-${id}`);
            if(valOut) { 
                if(v === 1) { valOut.style.backgroundColor = '#2563eb'; valOut.style.borderColor = '#60a5fa'; valOut.style.boxShadow = '0 0 25px rgba(37, 99, 235, 0.8)'; } 
                else { valOut.style.backgroundColor = '#0f172a'; valOut.style.borderColor = '#1e293b'; valOut.style.boxShadow = 'inset 0 4px 6px rgba(0, 0, 0, 0.6)'; } 
            }
        }

        function updateAnalogOutUI(id, val) {
            let v = Number(val); advancedData[id] = v;
            let elOut = document.getElementById(`val-out-${id}`);
            if(elOut) {
                elOut.innerText = v;
                elOut.style.color = getAnalogColor(v);
            }
            let sl = document.getElementById(`slider-${id}`);
            if(sl && sl.value != v) sl.value = v;
        }

        function createPlayingCard(id, type, mode, startVals) {
            
            // FIX: If card already exists, update its limits from MakeCode sync instead of ignoring it!
            if(document.getElementById(`card-${id}`)) {
                if (type === 'servo' && startVals) {
                    let p1El = document.getElementById(`pos1-val-${id}`);
                    let p2El = document.getElementById(`pos2-val-${id}`);
                    if(p1El && p2El) {
                        p1El.value = startVals[1] !== undefined ? parseInt(startVals[1]) : 0;
                        p2El.value = startVals[2] !== undefined ? parseInt(startVals[2]) : 180;
                        updateServoLimits(id); // Force slider boundaries to update
                    }
                } else if (type === 'motor' && startVals) {
                    let cwEl = document.getElementById(`cw-spd-${id}`);
                    let ccwEl = document.getElementById(`ccw-spd-${id}`);
                    if(cwEl && ccwEl) {
                        cwEl.value = startVals[1] !== undefined ? parseInt(startVals[1]) : 255;
                        ccwEl.value = startVals[2] !== undefined ? parseInt(startVals[2]) : 255;
                    }
                }
                return; 
            }
            
            if(cardPermissions[id] === undefined) {
                let savedPerms = JSON.parse(localStorage.getItem('makerlink_perms') || '{}');
                cardPermissions[id] = savedPerms[id] !== undefined ? savedPerms[id] : true;
            }

            activeCardTypes[id] = { type: type, mode: mode || "" }; 
            advancedData[id] = startVals && startVals[0] !== undefined ? (type === 'text' ? startVals[0] : Number(startVals[0])) : (type === 'text' ? "" : 0);
            
            const card = document.createElement('div'); 
            
            let borderTheme = type === 'analog' ? 'border-purple-500/60' : type === 'digital' ? 'border-emerald-500/60' : type === 'motor' ? 'border-orange-500/60' : type === 'text' ? 'border-pink-500/60' : 'border-blue-500/60';
            
            card.className = `maker-card bg-slate-800 rounded-xl border-2 ${borderTheme} shadow-lg relative z-10`; 
            card.id = `card-${id}`;
            card.setAttribute('data-size', '0');

            let colorClass = type === 'analog' ? 'text-purple-400' : type === 'digital' ? 'text-emerald-400' : type === 'motor' ? 'text-orange-400' : type === 'text' ? 'text-pink-400' : 'text-blue-400';
            let iconStr = type === 'analog' ? '📊' : type === 'digital' ? '🚥' : type === 'motor' ? '⚙️' : type === 'text' ? '📝' : '🦾';

            let isOutput = (type === 'analog' && mode === 'OUT') || (type === 'digital' && (mode === 'OUT' || mode === 'PUSH')) || type === 'motor' || type === 'servo';
            
            let headerBtnsHTML = '';
            
            headerBtnsHTML += `<div class="size-btns flex items-center bg-slate-800 rounded ml-2 overflow-hidden border border-slate-600"><button onclick="changeCardSize('${id}', -1)" class="px-2 hover:bg-slate-700 text-xs font-bold text-slate-300">-</button><button onclick="changeCardSize('${id}', 1)" class="px-2 border-l border-slate-600 hover:bg-slate-700 text-xs font-bold text-slate-300">+</button></div>`;

            if (isOutput) {
                let permLabel = cardPermissions[id] ? "🎮 Public" : "👁️ View Only";
                let permClass = cardPermissions[id] ? "bg-green-900/50 text-green-400 border-green-700" : "bg-red-900/50 text-red-400 border-red-700";
                headerBtnsHTML += `<button id="perm-btn-${id}" onclick="togglePermission('${id}')" class="ml-2 text-[10px] border px-1.5 py-0.5 rounded cursor-pointer hover:opacity-80 transition-opacity ${permClass}" title="Toggle Public Control">${permLabel}</button>`;
            }
            
            let visLabel = cardVisibility[id] !== false ? "👁️" : "🙈";
            let visClass = cardVisibility[id] !== false ? "bg-blue-900/50 text-blue-400 border-blue-700" : "bg-slate-700/50 text-slate-400 border-slate-600";
            headerBtnsHTML += `<button id="vis-btn-${id}" onclick="toggleVisibility('${id}')" class="ml-2 text-[10px] border px-1.5 py-0.5 rounded cursor-pointer hover:opacity-80 transition-colors ${visClass}" title="Toggle Public Visibility">${visLabel}</button>`;

            let html = `<div class="p-3 bg-slate-900 border-b-2 ${borderTheme} flex justify-between items-center rounded-t-xl"><div class="flex items-center gap-2"><span class="font-bold text-sm ${colorClass}">${id}</span><span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 border border-slate-700">${iconStr} ${mode ? mode : type.toUpperCase()}</span></div><div class="flex items-center">${headerBtnsHTML}</div></div><div class="p-4 flex-1 min-h-0 flex flex-col items-center justify-center bg-slate-800 overflow-hidden">`;

            if (type === 'analog' && mode === 'IN') {
                html += `<div class="w-full flex-1 relative min-h-[120px] bg-slate-900 rounded-lg border border-slate-700 mb-4 flex items-center justify-center overflow-hidden">
                             <div id="val-${id}" class="absolute z-10 text-6xl font-mono font-black tracking-tighter transition-colors duration-200" style="color: rgb(100, 116, 139); text-shadow: 0px 4px 15px rgba(0,0,0,1), 0px 0px 4px rgba(0,0,0,0.8);">0</div>
                             <canvas id="chart-${id}" class="absolute inset-0 w-full h-full opacity-60"></canvas>
                         </div>
                         <div class="flex gap-2 w-full mt-auto">

        function initSensorChart(id) { const ctx = document.getElementById(`chart-${id}`).getContext('2d'); sensorCharts[id] = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#c084fc', tension: 0.2, pointRadius: 0, borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } } }); }
        function updateSensorChartConfig(id) { const yMin = document.getElementById(`ymin-${id}`).value; const yMax = document.getElementById(`ymax-${id}`).value; if(sensorCharts[id]) { if (yMin === "") delete sensorCharts[id].options.scales.y.min; else sensorCharts[id].options.scales.y.min = parseFloat(yMin); if (yMax === "") delete sensorCharts[id].options.scales.y.max; else sensorCharts[id].options.scales.y.max = parseFloat(yMax); sensorCharts[id].update(); } }
        function pushSensorData(id, val) { if(!sensorCharts[id]) return; const chart = sensorCharts[id]; const xmaxEl = document.getElementById(`xmax-${id}`); const maxPts = (xmaxEl && xmaxEl.value !== "") ? parseInt(xmaxEl.value) : 0; chart.data.labels.push(''); chart.data.datasets[0].data.push(val); if(maxPts > 0 && chart.data.labels.length > maxPts) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); } chart.update(); }

        function updateVal(id, val) { document.getElementById(`val-${id}`).innerText = val + (id.startsWith('S') ? '°' : ''); advancedData[id] = Number(val) || val; }
        
        function setServoPos(id, posNum) { 
            let targetVal = parseInt(document.getElementById(`pos${posNum}-val-${id}`).value) || 0; 
            const slider = document.getElementById(`slider-${id}`); 
            if (slider) slider.value = targetVal; 
            updateVal(id, targetVal); 
            sendBluetoothCommand(`${id}:${targetVal}`); 
        }
        
        function setMotor(id, action) { 
            let val = 0; 
            if (action === 'ccw') { 
                let spd = parseInt(document.getElementById(`ccw-spd-${id}`).value) || 0; 
                val = -(spd > 255 ? 255 : (spd < 0 ? 0 : spd)); 
            } else if (action === 'cw') { 
                let spd = parseInt(document.getElementById(`cw-spd-${id}`).value) || 0; 
                val = (spd > 255 ? 255 : (spd < 0 ? 0 : spd)); 
            } 
            
            if (id === 'M1' || id === 'M2') { val = -val; }

            let displayStr = 'STOP (0)';
            if (val !== 0) {
                if (id === 'M1' || id === 'M2') {
                    displayStr = val < 0 ? `CW (${Math.abs(val)})` : `CCW (${Math.abs(val)})`;
                } else {
                    displayStr = val > 0 ? `CW (${Math.abs(val)})` : `CCW (${Math.abs(val)})`;
                }
            }

            document.getElementById(`val-${id}`).innerText = displayStr; 
            advancedData[id] = val; 
            sendBluetoothCommand(`${id}:${val}`); 
        }

        async function sendBluetoothCommand(cmd) { if (!txCharacteristic) { console.log(`[Simulated TX] ${cmd}`); return; } commandQueue.push(cmd); processCommandQueue(); }
        async function processCommandQueue() { if (isTransmitting || commandQueue.length === 0) return; isTransmitting = true; const cmd = commandQueue.shift(); try { let data = new TextEncoder().encode(cmd + '\n'); if (txCharacteristic.properties.writeWithoutResponse) { await txCharacteristic.writeValueWithoutResponse(data); } else { await txCharacteristic.writeValue(data); } } catch (err) {} finally { isTransmitting = false; if (commandQueue.length > 0) { setTimeout(processCommandQueue, 10); } } }

        async function connectBluetooth() {
            if (!navigator || !navigator.bluetooth) { showMsg("Web Bluetooth API is missing! Use Chrome or Edge."); return; }
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'BBC micro:bit' }], optionalServices: [UART_SERVICE_UUID] });
                bluetoothServer = await bluetoothDevice.gatt.connect(); uartService = await bluetoothServer.getPrimaryService(UART_SERVICE_UUID);
                txCharacteristic = await uartService.getCharacteristic(UART_TX_CHAR_UUID); rxCharacteristic = await uartService.getCharacteristic(UART_RX_CHAR_UUID);
                await rxCharacteristic.startNotifications(); rxCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                const btn = document.getElementById("btnConnect"); btn.innerHTML = "✅ Connected"; btn.classList.replace("bg-blue-600", "bg-green-600"); btn.classList.replace("hover:bg-blue-500", "hover:bg-green-500");
                setTimeout(() => { sendBluetoothCommand('SYNC'); appendTerminal("Bluetooth connected. Sent SYNC to hardware."); }, 300);

                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    const btn = document.getElementById("btnConnect"); btn.innerHTML = "🔌 Connect"; btn.classList.replace("bg-green-600", "bg-blue-600"); btn.classList.replace("hover:bg-green-500", "hover:bg-blue-500");
                    showMsg("Micro:bit disconnected!"); 
                    appendTerminal("Error: Bluetooth connection lost. Clearing dashboard.");
                    
                    const p = document.getElementById('ping-indicator');
                    if(p) {
                        clearTimeout(p.timer);
                        p.className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)] transition-colors duration-300";
                    }

                    commandQueue = [];
                    isTransmitting = false;
                    gridEl.innerHTML = ''; 
                    activeCardTypes = {}; 
                    if (isCloudActive) syncCloud(); 
                });
            } catch (error) { showMsg("Connection failed or cancelled. Check console (F12) for details."); }
        }

        function handleIncomingData(event) {
            pingBluetooth();
            let value = new TextDecoder().decode(event.target.value); rxBuffer += value; let lines = rxBuffer.split('\n');
            while(lines.length > 1) { 
                let line = lines.shift().trim();
                if (line.startsWith("LOG:")) { appendTerminal(line.substring(4)); } 
                else if (line.startsWith("INIT:")) {
                    let params = line.substring(5).split(","); let id = params[0];
                    if(id.startsWith("M")) createPlayingCard(id, 'motor', null, [params[2], params[3], params[4]]);
                    else if(id.startsWith("S")) createPlayingCard(id, 'servo', null, [params[2], params[3], params[4]]);
                    else if(id.startsWith("T")) createPlayingCard(id, 'text', null, [params[2]]);
                    else if(id.startsWith("A")) createPlayingCard(id, 'analog', params[1], [params[2]]);
                    else if(id.startsWith("D")) createPlayingCard(id, 'digital', params[1], [params[2]]);
                } else if (line !== "") { parseTelemetry(line); }
            }
            rxBuffer = lines[0];
        }

        function parseTelemetry(str) {
            let splitIdx = str.indexOf(':'); if(splitIdx === -1) return;
            let id = str.substring(0, splitIdx); let valStr = str.substring(splitIdx + 1);
            let cardData = activeCardTypes[id]; if (!cardData) return; advancedData[id] = valStr;

            if (cardData.type === 'text') { let el = document.getElementById(`val-${id}`); if(el) el.innerText = valStr; } 
            else {
                let valNum = parseFloat(valStr) || 0;
                if (cardData.type === 'analog' && cardData.mode === 'IN') { 
                    let el = document.getElementById(`val-${id}`); 
                    if(el) { el.innerText = valNum; el.style.color = getAnalogColor(valNum); pushSensorData(id, valNum); } 
                } 
                else if (cardData.type === 'analog' && cardData.mode === 'OUT') { updateAnalogOutUI(id, valNum); }
                else if (cardData.type === 'digital') { updateDigitalUI(id, valNum); }
                else if (cardData.type === 'motor') { 
                    let el = document.getElementById(`val-${id}`); 
                    if (el) { 
                        let displayStr = 'STOP (0)';
                        if (valNum !== 0) {
                            if (id === 'M1' || id === 'M2') {
                                displayStr = valNum < 0 ? `CW (${Math.abs(valNum)})` : `CCW (${Math.abs(valNum)})`;
                            } else {
                                displayStr = valNum > 0 ? `CW (${Math.abs(valNum)})` : `CCW (${Math.abs(valNum)})`;
                            }
                        }
                        el.innerText = displayStr; 
                    } 
                }
                else if (cardData.type === 'servo') { 
                    let el = document.getElementById(`slider-${id}`); 
                    if(el) { 
                        let minB = parseInt(el.min);
                        let maxB = parseInt(el.max);
                        
                        // FIX: Notify user if MakeCode attempts to send a telemetry value outside safe limits!
                        if (valNum < minB || valNum > maxB) {
                            showMsg(`⚠️ ${id} clamped to ${minB}° - ${maxB}° (Hardware Limit)`);
                            valNum = Math.max(minB, Math.min(maxB, valNum));
                        }
                        el.value = valNum; 
                    } 
                    let valEl = document.getElementById(`val-${id}`); 
                    if(valEl) valEl.innerText = valNum + '°'; 
                }
            }
        }

        function toggleCloud() {
            isCloudActive = !isCloudActive; const btn = document.getElementById('btn-cloud');
            if (isCloudActive) {
                cloudRoomId = Math.floor(1000 + Math.random() * 9000);
                btn.innerHTML = `🔴 Live: Room ${cloudRoomId}`; btn.className = "bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] animate-pulse shadow-[0_0_15px_rgba(220,38,38,0.5)]";
                db.ref('rooms/' + cloudRoomId).remove(); saveLayoutOrder(); 
                
                db.ref('rooms/' + cloudRoomId + '/command').on('child_added', (snap) => { 
                    const cmdData = snap.val(); 
                    if(cmdData && cmdData.cmd) { 
                        if (cmdData.cmd.includes(':POS1')) { setServoPos(cmdData.cmd.split(':')[0], 1); }
                        else if (cmdData.cmd.includes(':POS2')) { setServoPos(cmdData.cmd.split(':')[0], 2); }

                            sendBluetoothCommand(cmdData.cmd); 
                            parseTelemetry(cmdData.cmd);

            } else {
                btn.innerHTML = `☁️ Go Public`; btn.className = "bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg";
                clearInterval(cloudInterval); if(cloudRoomId) { db.ref('rooms/' + cloudRoomId).remove(); } appendTerminal("Cloud stream closed.");
            }
        }

        function syncCloud() {
            const payload = [];
            
            db.ref('rooms/' + cloudRoomId + '/config').set({ terminalVisible: cardVisibility['terminal'] !== false });
            db.ref('rooms/' + cloudRoomId + '/heartbeat').set(Date.now());

            Array.from(gridEl.children).forEach(cardDom => {
                let id = cardDom.id.replace('card-', ''); let info = activeCardTypes[id];
                
                if(cardVisibility[id] === false) return; 

                if(info) {
                    let cardData = {
                        id: String(id),

                        mode: info.mode ? String(info.mode) : "",
                        val: info.type === 'text' ? (advancedData[id] !== undefined ? String(advancedData[id]) : "") : (advancedData[id] != null && !Number.isNaN(Number(advancedData[id])) ? Number(advancedData[id]) : 0),
                        title: document.getElementById(`title-${id}`)?.value || "Label"
                    };
                    
                    let isOut = (info.type === 'analog' && info.mode === 'OUT') || (info.type === 'digital' && (info.mode === 'OUT' || info.mode === 'PUSH')) || info.type === 'motor' || info.type === 'servo';

                    if (info.type === 'analog' && info.mode === 'IN') {

                        cardData.time = document.getElementById(`time-${id}`)?.value || "0";

                    } else if (info.type === 'digital' && info.mode === 'PUSH') {

                    } else if (info.type === 'servo') {

                        cardData.pos2Val = Number(document.getElementById(`pos2-val-${id}`).value) || 180;
                        cardData.btnPos1 = document.getElementById(`btn-pos1-${id}`)?.value || "Pos 1"; 
                        cardData.btnPos2 = document.getElementById(`btn-pos2-${id}`)?.value || "Pos 2";
                    } else if (info.type === 'motor') {

                        cardData.cwSpd = Number(document.getElementById(`cw-spd-${id}`)?.value) || 255;
                        cardData.ccwSpd = Number(document.getElementById(`ccw-spd-${id}`)?.value) || 255;
                    }
                    payload.push(cardData);
                }
            });
            
            if (payload.length === 0) {
                db.ref('rooms/' + cloudRoomId + '/state').set({ empty: true }).catch(console.error);
            } else {
                db.ref('rooms/' + cloudRoomId + '/state').set(payload).catch(console.error);
            }
        }
    </script>
</body>
</html>
